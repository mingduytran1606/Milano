<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milano - Stone Order Calendar</title>
<script src="https://milano.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2733; --muted:#6b7683;
    --line:#e2e5ea; --line2:#eef1f4;
    --accent:#16b378; --accent-soft:#eafaf2; --accent-ink:#0f7a52;
    --danger:#e5484d;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --radius:14px; --datecol:200px; --tblfont:12.5px;
    --rule:#94a0ad;   /* date-column divider: a real rule, not a hairline */
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12161b; --panel:#1a1f26; --ink:#e8edf2; --muted:#9aa6b2;
      --line:#2a323b; --line2:#232a32;
      --accent:#35c993; --accent-soft:#173a30; --accent-ink:#7ee0bd; --rule:#5b6878;
      --shadow:0 1px 2px rgba(0,0,0,.4);}
  }
  :root[data-theme="light"]{ --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2733; --muted:#6b7683;
    --line:#e2e5ea; --line2:#eef1f4; --accent:#16b378; --accent-soft:#eafaf2; --accent-ink:#0f7a52;
    --rule:#94a0ad;}
  :root[data-theme="dark"]{ --bg:#12161b; --panel:#1a1f26; --ink:#e8edf2; --muted:#9aa6b2;
    --line:#2a323b; --line2:#232a32; --accent:#35c993; --accent-soft:#173a30; --accent-ink:#7ee0bd;
    --rule:#5b6878;}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{height:100%;display:flex;flex-direction:column;padding:14px;gap:12px}

  /* ---- toolbar: search + sort + assignee filter + cards, all on one line ---- */
  .toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .assign{font:inherit;font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:var(--shadow)}
  .assign:hover{border-color:var(--accent)}
  .assign.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  /* filter row: order count + status pills */
  .filterbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .count{font-size:14px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  /* status filter pills (replace the old ordered/delivered legend) */
  .statusbar{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:8px}
  .sfp{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none}
  .sfp:hover{border-color:var(--accent)}
  .sfp .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .sfp .cnt{font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;color:var(--muted);
    background:var(--line2);border-radius:999px;padding:0 7px;line-height:16px}
  .sfp.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .sfp.on .cnt{background:rgba(22,179,120,.18);color:var(--accent-ink)}

  /* ---- top stone search bar ---- */
  .searchbar{flex:1 1 260px;min-width:220px;position:relative;display:flex;align-items:center}
  .searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;pointer-events:none}
  .searchbar input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:11px 96px 11px 40px;box-shadow:var(--shadow)}
  .searchbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar .clr{position:absolute;right:76px;top:50%;transform:translateY(-50%);color:var(--muted);
    cursor:pointer;font-size:17px;line-height:1;padding:2px 5px;border-radius:6px}
  .searchbar .clr:hover{background:var(--line2);color:var(--ink)}
  .searchbar .clr[hidden]{display:none}
  .searchbar .match{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;
    color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .searchbar .match[hidden]{display:none}

  /* ---- body: calendar only ---- */
  .body{flex:1 1 auto;min-height:0;display:flex;gap:12px}

  /* ---- agenda event card (chip): a grid of customisable columns ---- */
  /* chip tint (background + border) is set inline from the line's Order_Status colour;
     text is a fixed dark ink so it stays readable on the light status tints in either theme */
  .ev{font-size:var(--ev-card-font,10.5px);line-height:1.32;border-radius:6px;padding:3px 8px;cursor:pointer;overflow:hidden;
    display:grid;gap:8px;align-items:center;color:#1d2733;border:1px solid transparent}
  .ev strong{font-weight:700}
  .ev em{font-style:italic;color:#5b6672}
  .evcol{min-width:0;overflow:hidden}
  .evcol.al-left{text-align:left}
  .evcol.al-centre{text-align:center}
  .evcol.al-right{text-align:right}
  .evpill{display:inline-block;max-width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:0 9px;vertical-align:middle}
  .evpill.hl{border:0;font-weight:700}
  /* templated card lines */
  .cline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cdivider{height:1px;background:var(--line2);margin:3px 0}
  .cbar{border-radius:5px;padding:0 5px;display:inline-block}
  .cpill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:0 7px;font-size:.92em;font-weight:700;color:var(--ink)}
  .cpill .cpd{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .avwrap{display:inline-flex;vertical-align:-4px}
  .avwrap .av{width:16px;height:16px;font-size:8.5px;margin-left:-4px;border:1.5px solid var(--panel)}
  .avwrap .av:first-child{margin-left:0}

  /* agenda: vertical list of days */
  .agenda{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:auto;display:block;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .ag-day{display:flex;gap:14px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line2)}
  .ag-date{flex:0 0 130px;font-size:12.5px;font-weight:700;color:var(--muted)}
  /* today: a light accent bar + accent-coloured date, no heavy filled pill */
  .ag-day.today{box-shadow:inset 3px 0 0 var(--accent)}
  .ag-day.today .ag-date{color:var(--accent-ink)}
  .ag-date .tdy{display:block;margin-top:1px;font-size:10px;font-weight:700;color:var(--accent-ink);letter-spacing:.02em}
  .ag-evs{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;min-width:0}
  .ag-empty{color:var(--muted);text-align:center;padding:40px;font-size:13px}
  /* today's placeholder: quieter than a real card, so it reads as an anchor not an order */
  .ag-none{color:var(--muted);font-size:11.5px;font-style:italic;padding:2px 0;cursor:pointer}

  /* assignee menu rows (reuse .pop) */
  .cprow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .cprow:hover,.cprow.on{background:var(--line2)}
  .cprow.on{color:var(--accent-ink);font-weight:600}
  .cprow .rtick{margin-left:auto;color:var(--accent-ink);font-weight:800}
  .av{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#fff}

  /* ---- day popover ---- */
  .pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 14px 36px rgba(16,24,40,.24);padding:10px 12px;min-width:240px;max-width:320px;max-height:70vh;overflow:auto}
  .pop[hidden]{display:none}
  .pop h4{margin:0 0 8px;font-size:12px;font-weight:800}
  .pev{padding:7px 0;border-top:1px solid var(--line2)}
  .pev:first-of-type{border-top:0}
  .pev .pline{display:flex;align-items:center;gap:6px}
  .pev .pname{font-weight:700;font-size:12.5px}
  .pev .pmeta{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* ---- card customisation modal ---- */
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);
    width:min(560px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .modal-close{margin-left:auto;cursor:pointer;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:6px}
  .modal-close:hover{background:var(--line2);color:var(--ink)}
  .ce-tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .ce-tab{border:0;background:var(--panel);color:var(--muted);padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .ce-tab+.ce-tab{border-left:1px solid var(--line)}
  .ce-tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
  .ce-body{padding:14px;overflow:auto}
  .ce-note{font-size:11.5px;color:var(--muted);margin-bottom:9px;line-height:1.5}
  .ce-ta{width:100%;min-height:92px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;outline:none}
  .ce-ta:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .ce-tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ce-tok{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:4px 8px;cursor:pointer;font:inherit;font-size:11px;color:var(--ink)}
  .ce-tok:hover{border-color:var(--accent);background:var(--accent-soft)}
  .ce-tok code{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--accent-ink)}
  .ce-tok span{color:var(--muted)}
  /* section (column) editor */
  .ce-sechead{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);margin:6px 0 8px}
  .ce-sec{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;background:var(--bg)}
  .ce-sec-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ce-sec-n{font-size:11px;font-weight:800;color:var(--muted);background:var(--line2);border-radius:6px;padding:1px 7px}
  .ce-sec-mv{cursor:pointer;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:7px;
    width:24px;height:24px;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
  .ce-sec-mv:hover{border-color:var(--accent);color:var(--accent-ink)}
  .ce-sec-mv.off{opacity:.25;pointer-events:none}
  .ce-sec-x{cursor:pointer;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:7px;
    width:24px;height:24px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
  .ce-sec-x:hover{border-color:var(--danger);color:var(--danger)}
  .ce-sec-x.off{opacity:.25;pointer-events:none}
  .ce-sta{width:100%;min-height:36px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:vertical;outline:none}
  .ce-sta:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .ce-secopts{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;align-items:center}
  .ce-optlab{font-size:11px;font-weight:600;color:var(--muted);margin-right:-6px}
  .ce-segm{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ce-segm button{border:0;background:var(--panel);color:var(--muted);padding:5px 10px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;min-width:30px}
  .ce-segm button+button{border-left:1px solid var(--line)}
  .ce-segm button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
  .ce-wstep{display:inline-flex;align-items:center;gap:6px}
  .ce-wstep .ce-fval{min-width:26px}
  .ce-addsec{font:inherit;font-size:12.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);
    border:1px dashed var(--accent);border-radius:9px;padding:9px 12px;cursor:pointer;width:100%;margin-top:2px}
  .ce-addsec:hover{filter:brightness(1.03)}
  .ce-addsec[disabled]{opacity:.5;cursor:not-allowed;border-style:solid}
  .ce-reset{margin-top:12px;font-size:12px;color:var(--accent-ink);cursor:pointer;display:inline-block}
  .ce-reset:hover{text-decoration:underline}
  .ce-fontrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px}
  .ce-flabel{color:var(--muted);font-weight:600;margin-right:auto}
  .ce-fbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:15px}
  .ce-fbtn:hover{border-color:var(--accent)}
  .ce-fval{font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
  .ce-foot{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
  .ce-scope{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .ce-btnrow{display:flex;gap:8px;justify-content:flex-end}
  .ce-save{font:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;border:1px solid var(--line)}
  .ce-save.ghost{background:var(--panel);color:var(--ink)}
  .ce-save.ghost:hover{background:var(--line2)}
  .ce-save.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ce-save.primary:hover{filter:brightness(1.06)}

  /* ---- edit panel (double-click a chip) ---- */
  .se-grid{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;align-items:center}
  .se-lab{font-size:11.5px;font-weight:600;color:var(--muted)}
  .se-in{width:100%;font:inherit;font-size:12.5px;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:7px 9px;outline:none}
  .se-in:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  textarea.se-in{min-height:56px;resize:vertical;line-height:1.45}
  .se-head{font-size:12.5px;font-weight:700;color:var(--ink)}
  .se-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .se-full{grid-column:1 / -1}
  /* existing job / new job switch */
  .se-seg{display:inline-flex;margin-top:12px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .se-seg button{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border:0;cursor:pointer;
    background:var(--bg);color:var(--muted)}
  .se-seg button+button{border-left:1px solid var(--line)}
  .se-seg button.on{background:var(--accent);color:#fff}
  /* assignee chips on a new job */
  .se-chips{display:flex;flex-wrap:wrap;gap:6px}
  .se-chip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11.5px;cursor:pointer;
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:3px 9px 3px 4px}
  .se-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  /* the chip you just created, so a create is visibly confirmed */
  @keyframes evnew{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}45%{box-shadow:0 0 0 3px var(--accent)}}
  .ev.ev-new,.strow.ev-new{animation:evnew 1.1s ease-in-out 2}
  .se-dirty{font-size:11.5px;color:var(--accent-ink);font-weight:600;margin-right:auto}
  /* status <select> gets a dot of the chosen colour in front of it */
  .se-statwrap{display:flex;align-items:center;gap:8px}
  .se-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}

  /* ---- bulk edit ---- */
  .assign.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .evrow{display:flex;align-items:center;gap:8px;min-width:0}
  .evrow .ev{flex:1 1 auto;min-width:0}
  /* fixed slot after the chip so chips align whether or not the line is flagged */
  .evgut{flex:0 0 14px;display:flex;justify-content:center;align-items:center}
  .evflag{width:14px;height:14px;border-radius:50%;background:var(--danger);color:#fff;cursor:help;
    font-size:10px;font-weight:800;line-height:14px;text-align:center;flex:0 0 auto}
  .evsel{flex:0 0 auto;width:15px;height:15px;cursor:pointer;accent-color:var(--accent);margin:0;
         justify-self:center;align-self:center}
  .ag-all{display:block;margin-top:5px;font-size:10.5px;font-weight:600;color:var(--accent-ink);cursor:pointer}
  .ag-all:hover{text-decoration:underline}
  .bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:70;display:none;
    align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.22);padding:9px 12px;font-size:12.5px;max-width:calc(100vw - 24px);flex-wrap:wrap}
  .bulkbar.open{display:flex}
  .bulkbar .bcount{font-weight:700}
  .bulkbar .blab{color:var(--muted);font-size:11.5px;font-weight:600}
  .bulkbar select.se-in,.bulkbar input.se-in{width:auto;padding:6px 8px}
  /* confirm / unsaved overlay, shared by both panels */
  .cf{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:95;display:none;align-items:center;justify-content:center;padding:20px}
  .cf.open{display:flex}
  .cf-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);
    width:min(400px,96vw);padding:16px}
  .cf-t{font-size:13.5px;font-weight:700;margin-bottom:6px}
  .cf-b{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px}
  .cf-f{display:flex;gap:8px;justify-content:flex-end}

  /* ---- table agenda: date + supplier box on the left, aligned rows on the right ---- */
  .ag-day.tbl{display:grid;grid-template-columns:var(--datecol) 1fr;gap:0;padding:0;align-items:stretch;
    border-bottom:2px solid var(--rule)}
  .ag-day.tbl:last-child{border-bottom:0}
  .ag-day.tbl>.ag-date{flex:none;padding:9px 12px 11px;background:var(--bg);
    border-right:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink)}
  .ag-day.tbl.today>.ag-date{background:var(--accent-soft)}
  .ag-day.tbl>.ag-none{padding:14px}
  .sthead{display:grid;grid-template-columns:var(--datecol) 1fr;border-bottom:1px solid var(--line);
    background:var(--bg);position:sticky;top:0;z-index:3}
  .stcols{display:grid}
  .sthead>.stlab:first-child{background:var(--bg);border-right:1px solid var(--line)}
  .stlab{padding:7px 8px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .stlab.ed{color:var(--accent-ink)}
  .stlab.r{text-align:right}
  .stlab.c{text-align:center}
  .strows{display:flex;flex-direction:column;min-width:0}
  .strow{display:grid;align-items:stretch;border-bottom:1px solid var(--line2)}
  .strow:hover{background:var(--accent-soft)}
  .stcell{font-size:var(--tblfont);padding:7px 8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;gap:4px}
  .stcell.r{justify-content:flex-end;font-variant-numeric:tabular-nums}
  .stcell.c{justify-content:center;padding-left:2px;padding-right:2px}
  .stcell.ed{cursor:text;border-radius:5px}
  .stcell.ed:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  .stcell.roc{color:var(--muted)}
  .stcell.saved{animation:stfl 1.1s ease-out}
  @keyframes stfl{0%{background:var(--accent);color:#fff}100%{background:transparent}}
  .stcell b{font-weight:700;color:var(--ink)}

  /* frozen (sticky) cells need an opaque background or the scrolling content shows through */

  .supgrp .lb{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .supgrp .gq{margin-right:auto;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .rowdel{justify-self:start;align-self:center;width:20px;height:20px;margin-left:6px;font:inherit;
    font-size:13px;line-height:1;color:var(--muted);background:none;border:1px solid transparent;
    border-radius:6px;cursor:pointer;opacity:0}
  .strow:hover .rowdel,.rowdel:focus-visible{opacity:1}

  .cpset{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:11px}
  .cpset .lab{font-size:11.5px;font-weight:600;color:var(--muted)}
  .cpset .grp{display:flex;align-items:center;gap:7px}
  /* ---- column editor: an inline panel, not an overlay ---- */
  .colpanel{display:none;flex:0 0 auto;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);padding:12px 14px;max-height:52vh;overflow-y:auto;box-shadow:var(--shadow)}
  .colpanel.open{display:block}
  .colpanel.open{display:block}
  .colpanel h4{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted)}
  .colpanel .cphint{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
  .cpfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);
    margin-top:11px;padding-top:10px}
  .cpfoot .msg{font-size:11.5px;color:var(--muted);margin-right:auto}
  /* drag to reorder */
  .colrow[draggable="true"]{cursor:grab}
  .colrow.dragging{opacity:.45}
  .colrow.dropbefore{box-shadow:inset 0 3px 0 var(--accent)}
  .colrow.dropafter{box-shadow:inset 0 -3px 0 var(--accent)}
  .grip{flex:0 0 auto;color:var(--muted);font-size:13px;line-height:1;letter-spacing:1px;
    cursor:grab;user-select:none}
  .colrow:hover .grip{color:var(--accent-ink)}
  /* ---- column editor ---- */
  .colrow{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 9px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .colname{font-size:12px;font-weight:600;color:var(--ink);width:118px;flex:0 0 118px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .colname.none{color:var(--muted);font-weight:500;font-style:italic}
  .rotag{font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
  .rotag.can{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
  .fmtseg,.miniseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .fmtseg button,.miniseg button{font:inherit;font-size:11px;font-weight:600;border:0;padding:3px 8px;
    cursor:pointer;background:var(--panel);color:var(--muted)}
  .fmtseg button{width:26px;padding:3px 0}
  .fmtseg button+button,.miniseg button+button{border-left:1px solid var(--line)}
  .fmtseg button.on,.miniseg button.on{background:var(--accent);color:#fff}
  .fmtseg .fb{font-weight:700} .fmtseg .fi{font-style:italic} .fmtseg .fu{text-decoration:underline}
  .coltog{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;
    cursor:pointer;margin-bottom:11px;width:fit-content}

    border:1px solid var(--line);border-radius:20px;padding:2px 9px;opacity:.75;z-index:40}
</style>

<script>
"use strict";
/* ============================================================
   Milano - Stone Order Calendar widget
   A single Agenda listing every Stone_Order line on its ORDER
   date (falling back to its delivery date only when it has no
   order date), grouped by day. Chips are tinted by the line's
   Order_Status. A stone search bar live-filters by stone name /
   supplier / code, a row of status pills filters by status
   (with a job count each), and a sort button flips the date
   order. Shares the Inbox / Catalogue foundation: design tokens,
   the Order_Status model, and the Grist read plumbing.
   ============================================================ */

// ---- status model ----
// These are only FALLBACK colours for standalone/preview. The real Order_Status
// choices + colours are read LIVE from Grist metadata on go-live (see applyStatusModel)
// so the chips, pills and order always match the Stone Order page exactly. Keep the
// keys here identical to the live Grist choice values (no "1./2." number prefixes).
const ORD_DEFAULT = {
  "Placed Order":"#FEF47A","Awaiting Order":"#FED6FB","Delivered":"#98FD90",
  "Awaiting Pickup":"#75B5FC","Not Delivered Yet":"#CCFEFE","On hold":"#FEE7C3",
  "No Stock":"#FD8182","Cancelled":"#DCDCDC","Delivered by WF":"#FFFFFF",
  "Delivered by Aboda":"#FFFFFF","Delivered by Client":"#FFFFFF","Return":"#DCDCDC",
  "Milano Pickup":"#e9edf1","N/A":"#e9edf1"};
const ORD_C = Object.assign({}, ORD_DEFAULT);
let STATUS_ORDER = Object.keys(ORD_DEFAULT);   // live choice order from Grist once known
const statusColor = s => ORD_C[s] || "#e9edf1";
// Overlay the live Order_Status choices/colours from Grist over the fallbacks above,
// so a single source of truth (the Grist column) drives colours + pill order.
function applyStatusModel(m){ if(!m) return;
  const opts=m.options||{};
  Object.keys(opts).forEach(k=>{ const f=opts[k]&&opts[k].fillColor; if(f) ORD_C[k]=f; });
  if(Array.isArray(m.choices)&&m.choices.length) STATUS_ORDER=m.choices.slice();
}
const statusLabel = s => (s==null||s==="") ? "To sort" : s;
const SPECIAL_COL = /^(manualSort|gristHelper_|id$)/;
// Delivered = any status meaning delivered, regardless of who delivered it.
function isDeliveredStatus(r){ const low=String(r.Order_Status||"").toLowerCase(); return /deliver/.test(low) && !/not deliver/.test(low); }
// Named status-filter groups. This is also the pill order. "Delivered" groups every
// delivered status together; extra pills are added for any other status found in the data.
const PRIMARY_GROUPS=[
  { key:"awaiting_order",  label:"Awaiting Order",   statuses:["Awaiting Order"] },
  { key:"ordered",         label:"Ordered",          statuses:["Placed Order"] },
  { key:"awaiting_pickup", label:"Awaiting Pick Up", statuses:["Awaiting Pickup"] },
  { key:"delivered",       label:"Delivered",        match:isDeliveredStatus, color:"Delivered" }
];
const PRIMARY_STATUSES=new Set(["Awaiting Order","Placed Order","Awaiting Pickup"]);
function matchGroup(g,r){ if(!g||g.key==="all")return true; if(g.match)return g.match(r);
  return (g.statuses||[]).includes(String(r.Order_Status||"")); }
// All + primary groups + one pill per other status present in the data.
function statusPills(){
  const pills=[{ key:"all", label:"All", color:null }].concat(PRIMARY_GROUPS);
  const extra=new Set();
  (state.stone||[]).forEach(r=>{ if(!calDateOf(r))return; const s=String(r.Order_Status||"");
    if(isDeliveredStatus(r)||PRIMARY_STATUSES.has(s))return; extra.add(s); });
  const ord=s=>{ const i=STATUS_ORDER.indexOf(s); return i<0?999:i; };   // follow the live Grist choice order
  [...extra].sort((a,b)=>(ord(a)-ord(b))||String(a).localeCompare(String(b)))
    .forEach(s=>pills.push({ key:"s:"+s, label:statusLabel(s), statuses:[s], color:s }));
  // the leftovers: undated, not flagged, job already past Quote
  if(naRows().length) pills.push({ key:"na", label:"N/A", statuses:[], color:"N/A", na:true });
  // last pill, and only when there is something to fix
  if(attentionRows().length)
    pills.push({ key:"flagged", label:"Needs attention", match:r=>dataFlags(r).length>0, flag:true });
  return pills;
}
function findGroup(key){ return statusPills().find(p=>p.key===key)||null; }

// ---- generic helpers ----
const $=(t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
function refId(v){ if(v==null)return null; if(typeof v==="number")return v;
  if(Array.isArray(v))return v[2]; if(typeof v==="object")return v.rowId!=null?v.rowId:v.id; return v; }
function toDate(v){ if(v==null||v==="")return null;
  if(typeof v==="number")return new Date(v*1000);
  if(v instanceof Date)return v; const d=new Date(v); return isNaN(d)?null:d; }
function fmtDMY(v){ const d=toDate(v); if(!d)return "-";
  return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear(); }
const num=v=>{ const n=Number(v); return isFinite(n)?n:0; };
function ymd(d){ return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function columnarToRows(t){ if(!t||!t.id)return []; return t.id.map((id,i)=>{const o={id}; for(const k in t)if(k!=="id")o[k]=t[k][i]; return o;}); }
function hexRgb(h){ h=String(h||"").replace("#",""); if(h.length===3)h=h.split("").map(c=>c+c).join("");
  return {r:parseInt(h.slice(0,2),16)||0,g:parseInt(h.slice(2,4),16)||0,b:parseInt(h.slice(4,6),16)||0}; }
function softTint(hex){ const {r,g,b}=hexRgb(hex||"#cfd4d1");
  return { bg:"rgb("+Math.round(r+(255-r)*.72)+","+Math.round(g+(255-g)*.72)+","+Math.round(b+(255-b)*.72)+")",
           dot:"rgb("+Math.round(r*.66)+","+Math.round(g*.66)+","+Math.round(b*.66)+")" }; }
function txtNode(s){ return (s==null||s==="")?null:document.createTextNode(String(s)); }

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// ---- state ----
const state={
  stone:[], jobs:[], catalogue:[], clients:[], grist:false,
  ref:{ product:null, client:null },
  assignee:null,                        // null = all assignees
  searchQ:"",                           // stone search, live-filters events
  statusFilter:"all",                   // status-pill filter (group/status key)
  sortDir:"asc",                        // agenda date order: asc = oldest first
  bulk:false,                           // bulk-edit mode: checkboxes + the bottom action bar
  sel:new Set(),                        // row ids ticked for bulk edit
  colType:{},                           // Stone_Order colId -> Grist type, for writing dates back
  jobColType:{},                        // Jobs_Detail colId -> Grist type
  jobChoices:{},                        // live choice lists for the job's Choice columns
  jobOpen:null,                         // the job row id the panel is showing
  writable:null,                        // Stone_Order colId -> true for non-formula columns (null = unknown)
  writableJob:null,                     // Jobs_Detail colId -> true, same idea (null = unknown)
  flashId:null,                         // row id to highlight after a create, so you can see what you made
  jobById:{}, catById:{}
};
window._stonecal=state;

const PREF_LS='milano_stonecal_prefs';
// Table columns persist the same way the card design did: kept locally per person, and publishable
// to everyone through grist.setOption so one operator can set the shared default.
const TBL_LS='milano_stonecal_table';
let colScope='everyone';
let dateColW=200, tblFont=12.5;
function applyTableVars(){
  const rs=document.documentElement.style;
  rs.setProperty("--datecol",dateColW+"px");
  rs.setProperty("--tblfont",tblFont+"px");
}
// Only accept known column keys and sane values, so a stale or hand-edited option can't break the grid.
function normaliseTblCols(v){
  if(!Array.isArray(v)) return null;
  const out=[];
  v.forEach(c=>{
    const k=c&&c.k; if(!k||!COLDEF[k]||out.some(o=>o.k===k)) return;
    out.push({ k, w:Math.max(30,Math.min(320,Math.round(Number(c.w)||COLDEF[k].w))),
      align:["left","centre","right"].includes(c.align)?c.align:(COLDEF[k].align||"left"),
      style:c.style==="pill"?"pill":"plain",
      b:!!c.b, i:!!c.i, u:!!c.u });
  });
  return out.length?out:null;
}
function loadTablePrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(TBL_LS)||"{}")||{};
    const cols=normaliseTblCols(p.cols); if(cols) tblCols=cols;
    if(typeof p.totals==="boolean") showTotals=p.totals;
    if(typeof p.datecol==="number") dateColW=Math.max(120,Math.min(360,p.datecol));
    if(typeof p.font==="number") tblFont=Math.max(9.5,Math.min(18,p.font));
    if(p.scope==="me"||p.scope==="everyone") colScope=p.scope;
    if(typeof p.freeze==="number") tblFreeze=Math.max(0,Math.min(9,p.freeze));
  }catch(e){}
  applyTableVars();
}
function saveTablePrefs(){
  applyTableVars();
  try{ localStorage.setItem(TBL_LS,JSON.stringify({cols:tblCols,totals:showTotals,
    datecol:dateColW,font:tblFont,scope:colScope,freeze:tblFreeze})); }catch(e){}
}
function publishTableCols(){
  try{ grist.setOption("tblCols",tblCols); grist.setOption("tblTotals",showTotals);
       grist.setOption("tblDateCol",dateColW); grist.setOption("tblFont",tblFont);
       grist.setOption("tblFreeze",tblFreeze); }catch(e){}
}
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem(PREF_LS)||"{}")||{};
  if(p.sort==="asc"||p.sort==="desc") state.sortDir=p.sort;
  if(typeof p.groupsup==="boolean") groupBySup=p.groupsup; }catch(e){} }
// The sort goes to BOTH stores on purpose. localStorage alone is not enough: the widget runs in a
// cross-origin iframe, so a browser set to block third-party storage throws here (swallowed by the
// catch) and the direction silently reverted on every reload. grist.setOption lives in the document,
// so it survives that — same belt-and-braces the column prefs already had.
function savePrefs(){
  try{ localStorage.setItem(PREF_LS,JSON.stringify({sort:state.sortDir,groupsup:groupBySup})); }catch(e){}
  try{ grist.setOption("sort",state.sortDir); }catch(e){}
  try{ grist.setOption("groupsup",groupBySup); }catch(e){}
}
function saveLocalCards(){ try{ localStorage.setItem(CARD_LS,JSON.stringify({cols:eventCardCols,scope:cardScope,ef:eventCardFont})); }catch(e){} }
function publishCards(){ try{ grist.setOption("eventCardCols",eventCardCols);
  grist.setOption("eventCardFont",eventCardFont); }catch(e){} }
function applyGristOptions(opts){
  if(!opts) return;
  // The sort is adopted before the column gate below: that gate is about the column layout, and a
  // person keeping their own columns ("me") still wants the remembered agenda direction back.
  let sorted=false;
  if(opts.sort==="asc"||opts.sort==="desc"){
    if(state.sortDir!==opts.sort){ state.sortDir=opts.sort; sorted=true; }
  }
  if(typeof opts.groupsup==="boolean" && opts.groupsup!==groupBySup){ groupBySup=opts.groupsup; sorted=true; }
  const editing=colPanelOpen;                      // don't reshuffle while someone is editing
  if(colScope==="me" || editing){ if(sorted) render(); return; }
  const cols=normaliseTblCols(opts.tblCols);
  if(cols) tblCols=cols;
  if(typeof opts.tblTotals==="boolean") showTotals=opts.tblTotals;
  if(typeof opts.tblDateCol==="number") dateColW=Math.max(120,Math.min(360,opts.tblDateCol));
  if(typeof opts.tblFont==="number") tblFont=Math.max(9.5,Math.min(18,opts.tblFont));
  if(typeof opts.tblFreeze==="number") tblFreeze=Math.max(0,Math.min(9,opts.tblFreeze));
  applyTableVars();
  render();
}

// ---- lookups ----
function reindex(){ state.jobById={}; state.jobs.forEach(j=>state.jobById[j.id]=j);
  state.catById={}; state.catalogue.forEach(c=>state.catById[c.id]=c); }
function jobFor(r){ return state.jobById[refId(r.Job)]||null; }
function catFor(r){ return state.catById[refId(r.Product)]||null; }
// Client display name, via whichever column the Client ref actually points at.
function clientLabel(c){ const R=state.ref.client;
  return (R&&R.labelCol&&c[R.labelCol]) || c.Client_Name || c.Name || c.Client || ("#"+c.id); }
// {id,name} for the customer autocomplete. Falls back to the distinct client names already
// on the jobs when the Client table can't be resolved, so the picker is never empty.
function distinctClients(){
  if(state.ref.client && (state.clients||[]).length)
    return state.clients.map(c=>({ id:c.id, name:String(clientLabel(c)) }));
  const seen={}; (state.jobs||[]).forEach(j=>{ const n=String(j.Client_Label||"").trim(); if(n) seen[n]=1; });
  return Object.keys(seen).map(n=>({ id:null, name:n }));
}
// Assignees live on the job as a Grist ChoiceList (["L", ...names]).
function choiceList(v){ if(Array.isArray(v)) return (v[0]==="L"?v.slice(1):v.filter(x=>typeof x==="string"));
  return (typeof v==="string"&&v)?[v]:[]; }
function assigneesOf(r){ const j=jobFor(r); return j?choiceList(j.Assigned_To):[]; }
function allAssignees(){ const s=new Set(); (state.jobs||[]).forEach(j=>choiceList(j.Assigned_To).forEach(a=>a&&s.add(a)));
  return [...s].sort((a,b)=>String(a).toLowerCase().localeCompare(String(b).toLowerCase())); }
// Stable colour per assignee (for the avatar chips in the menu).
function avatarColor(name){ let h=0; const s=String(name||""); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return "hsl("+(h%360)+",55%,45%)"; }
function initials(name){ return String(name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?"; }
function stoneLabel(r){ const c=catFor(r);

function jobClient(j){ return j ? ((String(j.Client_Label||"")).trim() || (String(j.Job_Address||"")).trim() || j.Job_ID || ("#"+j.id)) : "-"; }
function jobCode(j){ return j ? (j.Job_ID || ("#"+j.id)) : ""; }

// ---- slabs ----
// A slab count is the ordered qty, falling back to the scope qty for the suppliers we never place
// an order with (WF, Aboda, client-supplied). Same rule bulk edit already uses.
function slabsOf(r){ return num(r.Ordered_Qty)||num(r.Scope_Qty)||0; }
const slabSum=rs=>Math.round(rs.reduce((s,r)=>s+slabsOf(r),0)*10)/10;
function stageOf(r){ const j=jobFor(r); return String((j&&j.Stage)||"").trim(); }
const isQuote=r=>/quote/i.test(stageOf(r));
const escH=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const DASH='<span class="stzero">-</span>';
const txtH=s=>(s==null||s==="")?DASH:escH(s);
// Price per slab. Stone_Order.Product_Price_slab is a formula column ($Product.Price_Slab), so it
// is normally already on the row; fall back to the linked catalogue row for the cases where the
// widget has the catalogue loaded but the formula value has not come through yet. Unpriced products
// read 0 in Grist (Numeric empty is 0, not null), which we show as "-" rather than "$0".
function priceOf(r){
  let v=num(r.Product_Price_slab);

}
const STAGE_C={"Quote":"#FEF47A","Live":"#98FD90","WIP":"#CCFEFE","Completed":"#FECC81",

// ---- table columns ----
// One entry per available column. `edit` names the Stone_Order field a cell writes back to and

const COLDEF={

  orderdate:   {label:"Order date",   w:100, edit:{f:"Order_Date",t:"date"},

  deliverydate:{label:"Delivery date",w:108, edit:{f:"Delivery_Date",t:"date"},
                 html:r=>txtH(toDate(r.Delivery_Date)?fmtDMY(r.Delivery_Date):"")},
  inv:         {label:"Invoice",      w:100, edit:{f:"INV",t:"text"},  html:r=>txtH(r.INV)},
  note:        {label:"Note",         w:160, edit:{f:"Note",t:"text"}, html:r=>txtH(r.Note)},
  price:       {label:"$ / slab",     w:84,  align:"right",            html:r=>txtH(priceOf(r))},
  // NOTE: priceOf() is defined below with the other row helpers. It was once referenced here

  assigned:    {label:"Assignees",    w:110, html:r=>{ const a=assigneesOf(r); return a.length?escH(a.join(", ")):DASH; }},
  flag:        {label:"",             w:34,  align:"centre",
                 html:r=>{ const f=dataFlags(r); return f.length
                   ? '<span class="evflag" title="'+escH(f.join(" / "))+'">!</span>' : ""; }}
};
const mkCol=(k,over)=>Object.assign({k,w:COLDEF[k].w,align:COLDEF[k].align||"left",
  style:"plain",b:false,i:false,u:false},over||{});
const DEFAULT_COLS=["client","jobstatus","stone","supplier","scope","ordered","delivered","status","flag"];
let tblCols=DEFAULT_COLS.map(k=>mkCol(k,k==="client"?{b:true}:null));
let showTotals=true;
let groupBySup=false;   // group each day's rows under supplier headers
// Freeze panes. 0 = nothing, 1 = the date gutter, 2 = date + the first column, 3 = date + two, ...
// Only ever a contiguous block from the left, because that is the only thing sticky positioning
// can express without the frozen cells floating over a gap.
let tblFreeze=0;
// The 26px slot carries the row handle: the bulk tick box, which leads the row so a column of
// boxes is easy to run down, or the remove "x", which stays at the end out of the way.
// Header, data rows and the totals row all use this one template, so the slot must move in all
// three together (see the leading spacer in stColHead / the totals row).
const colTemplate=()=>{
  const cols=tblCols.map(c=>"minmax("+c.w+"px,"+c.w+"fr)").join(" ");
  return state.bulk ? "26px "+cols : cols+" 26px";
};
// .agenda scrolls sideways, and a block/grid child of a scroll container is only as wide as the
// VISIBLE area — so every horizontal rule (day boundary, row line, header underline) stopped dead
// at the right edge of the pane instead of running the width of the table. Pinning an explicit
// min-width equal to the column widths makes each of those boxes span the real table width.
// Done in px rather than max-content deliberately: max-content would let cells size to their text
// and blow out the fixed column widths, losing the ellipsis truncation.
const HANDLE_PX=26;
const colBodyPx=()=>tblCols.reduce((s,c)=>s+c.w,0)+HANDLE_PX;   // the columns grid
// Where each frozen thing sits, measured from the left edge of the scrolling area. Offsets are
// absolute because sticky resolves against the scroll container (.agenda), not the nested grid.
function freezePlan(){
  // Always leave at least one column free to scroll, otherwise freezing everything just makes
  // the table immovable and the feature looks broken.
  const nCols=Math.max(0,Math.min(tblFreeze-1,Math.max(0,tblCols.length-1)));
  const plan={ date:tblFreeze>=1, handle:null, cols:[], edge:0 };
  if(!plan.date) return plan;
  let x=dateColW;
  if(state.bulk){ plan.handle=x; x+=HANDLE_PX; }   // in bulk the tick box leads the columns
  for(let i=0;i<nCols;i++){ plan.cols.push(x); x+=tblCols[i].w; }
  plan.edge=x;
  return plan;
}
// Pin one cell open at a given offset. `last` draws the edge that separates frozen from scrolling.
function freezeCell(el,left,last){
  el.classList.add("frz"); if(last) el.classList.add("frz-edge");
  el.style.position="sticky"; el.style.left=left+"px";
}
const colRowPx =()=>dateColW+colBodyPx();                        // date gutter + columns
const alignCls=a=>a==="right"?" r":a==="centre"?" c":"";
const wrapFmt=(h,c)=>{ let s=h; if(c.u)s="<u>"+s+"</u>"; if(c.i)s="<i>"+s+"</i>"; if(c.b)s="<b>"+s+"</b>"; return s; };

// Every stone line appears on its ORDER date (falling back to the delivery date
// only when there is no order date, so nothing silently vanishes).
function calDateOf(r){ const d = toDate(r.Order_Date) || toDate(r.Delivery_Date); return d ? { date:d } : null; }
function passAssignee(r){ return !state.assignee || assigneesOf(r).includes(state.assignee); }
// Search matches the STONE (name/supplier/code/order status) AND its JOB, mirroring
// the Inbox search fields (client, address, job id, stage, payment, assignees), so
// anything you can find in the Inbox you can find here too, even without the client name.
// statusLabel() folds a blank Order_Status in as "To sort" so it's searchable too.
function stoneHaystack(r){ const c=catFor(r);
  return [stoneLabel(r), r.Product_Supplier, r.Product_Code, r.Stone, c&&c.Supplier, c&&c.Product_Full,
    statusLabel(r.Order_Status), dateHaystack(r.Order_Date), dateHaystack(r.Delivery_Date)]
    .filter(Boolean).join(" ").toLowerCase(); }
// A date is searchable in the shapes people actually type it: the table's own DD-MM-YYYY, the same
// with slashes, "26 jul"/"jul 26", the month and year on their own, and the ISO form. Written out in
// full rather than matched with a parser so the existing word-start matcher keeps working.
function dateHaystack(v){
  const d=toDate(v); if(!d) return "";
  const dd=String(d.getDate()).padStart(2,"0"), mm=String(d.getMonth()+1).padStart(2,"0");
  const y=d.getFullYear(), mon=MONTHS[d.getMonth()], m3=mon.slice(0,3), dow=DOW[(d.getDay()+6)%7];
  return [dd+"-"+mm+"-"+y, dd+"/"+mm+"/"+y, y+"-"+mm+"-"+dd,
          d.getDate()+" "+m3, d.getDate()+" "+mon, m3+" "+d.getDate(),
          m3+" "+y, mon+" "+y, mon, m3, dow, String(y)].join(" ");
}
function jobHaystack(j){ if(!j) return "";
  return [j.Client_Label, j.Job_Address, j.Address_Formatted, j.Job_ID, j.Stage, j.Payment_Status,
    choiceList(j.Assigned_To).join(" ")].filter(Boolean).join(" ").toLowerCase(); }
// Match at word starts (like the Inbox) so "live" won't hit inside "de-live-red"
// while "deliv" still matches "Delivered"; substring fallback for non-word queries.
function searchMatcher(q){ const esc=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(!/^\w/.test(q)) return { test:h=>h.includes(q) };
  try{ return new RegExp("\\b"+esc); }catch(e){ return { test:h=>h.includes(q) }; } }
function passSearch(r){ const q=(state.searchQ||"").trim().toLowerCase(); if(!q) return true;
  return searchMatcher(q).test(stoneHaystack(r)+" "+jobHaystack(jobFor(r))); }
function passStatus(r){ return state.statusFilter==="all" || matchGroup(findGroup(state.statusFilter),r); }
// The set of lines the agenda draws from before the status filter. Also feeds the pill job counts.
// Rule, as agreed: a job still at Quote is never shown. Of the rest, the existing flagging rules
// decide what needs attention; whatever is left over and undated falls into the N/A bucket.
// Product_Supplier is the formula $Product.Supplier, so a line reads as having no supplier
// whenever the catalogue row it points at has an empty Supplier field - even though the supplier
// is sitting right there at the front of the product label ("WF | Marble | Venus Gold ..."). Rather
// than bucket those under "(no supplier)", recover the name from the label, checked against the
// suppliers the catalogue actually uses so a stray word can never invent one. Display only: the
// real fix is to fill Supplier in on the catalogue row.
const _norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function knownSuppliers(){
  const out=[]; const seen={};
  (state.catalogue||[]).forEach(c=>{ const v=String(c.Supplier||"").trim();
    if(v && !seen[_norm(v)]){ seen[_norm(v)]=1; out.push(v); } });
  return out;
}
function supplierFromLabel(c){
  if(!c) return "";
  const lab=String(c.Product_Full||"").trim(); if(!lab) return "";
  const known=knownSuppliers(); if(!known.length) return "";
  const first=lab.split("|")[0].trim();
  if(first){ const hit=known.find(k=>_norm(k)===_norm(first)); if(hit) return hit; }
  // otherwise the longest known supplier the label actually starts with
  const n=_norm(lab);
  return known.filter(k=>_norm(k) && n.indexOf(_norm(k))===0)
              .sort((a,b)=>_norm(b).length-_norm(a).length)[0] || "";
}
function supplierOf(r){
  const c=catFor(r);
  const s=r.Product_Supplier||(c&&c.Supplier)||supplierFromLabel(c)||"";
  return String(s).trim()||"(no supplier)";
}
// Everything in scope before dates or the status pill: Quote excluded, assignee + search applied.
function liveRows(){ return (state.stone||[]).filter(r=>!isQuote(r)&&passAssignee(r)&&passSearch(r)); }
function attentionRows(){ return liveRows().filter(r=>dataFlags(r).length>0); }
function naRows(){ return liveRows().filter(r=>!calDateOf(r)&&!dataFlags(r).length); }
// The dated set the day bands draw from.
function baseRows(){ return liveRows().filter(r=>calDateOf(r)); }
// Rows with no date at all that the current pill still wants shown, so the pill count is reachable.
function undatedShown(){
  if(state.statusFilter==="flagged") return attentionRows().filter(r=>!calDateOf(r));
  if(state.statusFilter==="na") return naRows();
  return [];
}
// Every event indexed by ymd (respecting assignee + search + status filter).
function buildEventIndex(){
  const byYmd={};
  baseRows().forEach(r=>{ if(!passStatus(r)) return; const cd=calDateOf(r);
    const k=ymd(cd.date);
    (byYmd[k]=byYmd[k]||[]).push({r,date:cd.date}); });
  return byYmd;
}
// Count all stone lines matching search + assignee (any date): drives the pill in the search bar.
function matchingCount(){ return baseRows().length; }
// Distinct jobs among the base rows that fall in a given status group: the pill counts.
function jobCountForGroup(g){
  if(!g) return 0;
  if(g.key==="flagged") return slabSum(attentionRows());
  if(g.key==="na") return slabSum(naRows());
  if(g.key==="all") return slabSum(baseRows());
  return slabSum(baseRows().filter(r=>matchGroup(g,r)));
}
function eventsOn(byYmd,d){
  return (byYmd[ymd(d)]||[]).slice()
    .sort((a,b)=>jobClient(jobFor(a.r)).localeCompare(jobClient(jobFor(b.r))));
}

// ============================================================
//  RENDER
// ============================================================
function render(){
  reindex();
  document.getElementById("demoTag").hidden=state.grist;
  const ab=document.getElementById("assignBtn");
  ab.textContent=(state.assignee||"All assignees")+" ▾"; ab.classList.toggle("on",!!state.assignee);

  // search bar: clear button + live match count
  const q=(state.searchQ||"").trim();
  document.getElementById("searchClr").hidden=!q;
  const mc=document.getElementById("matchCount");
  if(q){ mc.textContent=slabSum(baseRows())+" slabs"; mc.hidden=false; }
  else mc.hidden=true;

  document.getElementById("groupBtn").classList.toggle("on",groupBySup);

  // sort button label reflects the current direction
  document.getElementById("sortBtn").textContent = "Sort: "+(state.sortDir==="desc"?"Newest first":"Oldest first")+" ▾";

  // status filter pills (with a job count each)
  renderStatusbar();

  const byYmd=buildEventIndex();

  // every day that has an event, in the chosen date order
  const dayKeys=Object.keys(byYmd).map(Number).sort((a,b)=> state.sortDir==="desc" ? b-a : a-b);

  // Today always gets a row (even with nothing on) so it stays as an anchor point in the list.
  // Skipped when nothing matches at all: the empty-state message covers that case instead.
  const todayKey=ymd(new Date());
  if(dayKeys.length && !dayKeys.includes(todayKey)){
    dayKeys.push(todayKey);
    dayKeys.sort((a,b)=> state.sortDir==="desc" ? b-a : a-b);
  }

  // title: slabs currently listed, which is what the team counts in
  let listed=[]; dayKeys.forEach(k=>{ (byYmd[k]||[]).forEach(e=>listed.push(e.r)); });
  listed=listed.concat(undatedShown());
  document.getElementById("title").textContent = slabSum(listed)+" slabs";

  renderAgenda(byYmd,dayKeys);

  // drop any selection that a search/filter change has scrolled out of view, then refresh the bar.
  // The live set must cover EVERY row the agenda renders, undated ones included — they are exactly
  // the orders a bulk delivery-date edit is aimed at, and leaving them out silently unticked them
  // on the next render (so Apply then did nothing).
  if(state.bulk && state.sel.size){
    const live=new Set(); dayKeys.forEach(k=>(byYmd[k]||[]).forEach(e=>live.add(e.r.id)));
    undatedShown().forEach(r=>live.add(r.id));
    [...state.sel].forEach(id=>{ if(!live.has(id)) state.sel.delete(id); });
  }
  renderBulkBar();
}
function renderStatusbar(){
  const bar=document.getElementById("statusbar"); bar.innerHTML="";
  statusPills().forEach(p=>{
    const pill=$("div","sfp"+(state.statusFilter===p.key?" on":""));
    const colStatus = p.color || (p.statuses && p.statuses[0]);   // "All" has none
    if(p.flag){ const f=$("span","evflag","!");
      f.title="Lines whose delivery date, delivered qty and status don't agree"; pill.appendChild(f); }
    else if(colStatus){ const d=$("span","dot"); d.style.background=statusColor(colStatus); pill.appendChild(d); }
    pill.appendChild(document.createTextNode(p.label));
    pill.appendChild($("span","cnt",String(jobCountForGroup(p))));
    pill.onclick=()=>{ state.statusFilter=(p.key!=="all"&&state.statusFilter===p.key)?"all":p.key; render(); };
    bar.appendChild(pill);
  });
}
// Turn a ymd integer (y*10000 + m*100 + d) back into a Date.
function dateFromYmd(k){ return new Date(Math.floor(k/10000), Math.floor(k/100)%100 - 1, k%100); }
// Per-day "select all" toggles for bulk mode, rebuilt with the agenda. Ticking one checkbox only
// refreshes the bar (re-rendering would rebuild the boxes mid-click), so the bar refreshes these.
let dayToggles=[];
function refreshDayToggles(){
  dayToggles.forEach(t=>{ t.el.textContent = t.ids.every(id=>state.sel.has(id)) ? "Clear day" : "Select day"; });
}
function stColHead(){
  const h=$("div","sthead"); h.style.minWidth=colRowPx()+"px";
  const fz=freezePlan();
  const dlab=$("div","stlab","Date");
  if(fz.date) freezeCell(dlab,0,!fz.cols.length&&fz.handle==null);
  h.appendChild(dlab);
  const cols=$("div","stcols"); cols.style.gridTemplateColumns=colTemplate();
  cols.style.minWidth=colBodyPx()+"px";
  if(state.bulk){ const sp=$("div","stlab");            // spacer over the leading tick-box column
    if(fz.handle!=null) freezeCell(sp,fz.handle,!fz.cols.length);
    cols.appendChild(sp); }
  tblCols.forEach((c,i)=>{
    const def=COLDEF[c.k];
    const l=$("div","stlab"+alignCls(c.align)+(def.edit?" ed":""));
    l.textContent=def.label;
    if(i<fz.cols.length) freezeCell(l,fz.cols[i],i===fz.cols.length-1);
    cols.appendChild(l);
  });
