}
// One table row per stone line. Read-only cells are muted; editable ones write on commit.
function stRow(r){
  const row=$("div","strow");
  row.style.gridTemplateColumns=colTemplate();
  row.style.minWidth=colBodyPx()+"px";
  const fz=freezePlan();
  if(state.bulk){                        // leads the row, so the boxes form one column down the left
    const box=document.createElement("input"); box.type="checkbox"; box.className="evsel";
    box.checked=state.sel.has(r.id); box.title="Select for bulk edit";
    box.setAttribute("aria-label","Select the order for "+jobClient(jobFor(r))+" for bulk edit");
    box.onclick=ev=>ev.stopPropagation();
    box.onchange=()=>{ if(box.checked) state.sel.add(r.id); else state.sel.delete(r.id); renderBulkBar(); };
    if(fz.handle!=null) freezeCell(box,fz.handle,!fz.cols.length);
    row.appendChild(box);
  }
  tblCols.forEach((c,ci)=>{
    const def=COLDEF[c.k];
    const cell=$("div","stcell"+alignCls(c.align)+(def.edit?" ed":" roc"));
    cell.dataset.rid=String(r.id); cell.dataset.k=c.k;
    const raw=def.html(r);
    const inner=wrapFmt(raw,c);
    cell.innerHTML=(c.style==="pill"&&raw)?('<span class="evpill">'+inner+"</span>"):inner;
    if(def.edit){ cell.title="Click to edit"; cell.onclick=ev=>{ ev.stopPropagation(); startCellEdit(cell,r,c); }; }
    if(ci<fz.cols.length) freezeCell(cell,fz.cols[ci],ci===fz.cols.length-1);
    row.appendChild(cell);
  });
  if(!state.bulk){
    const del=document.createElement("button"); del.className="rowdel"; del.type="button";
    del.textContent="×"; del.title="Remove this order";
    del.setAttribute("aria-label","Remove the order for "+jobClient(jobFor(r)));
    del.onclick=ev=>{ ev.stopPropagation(); askRemove(r); };
    row.appendChild(del);
  }
  // Double-click anywhere on the row opens the job panel. Single clicks still edit cells, and a
  // dblclick that lands inside an open cell editor is left to the editor.
  row.ondblclick=ev=>{
    if(ev.target && ev.target.closest && ev.target.closest("input,select,textarea,.rowdel,.evsel")) return;
    ev.preventDefault(); ev.stopPropagation(); closePops();
    state.jobFromRow=r.id;
    openJobPanel(jobFor(r));
  };
  row.dataset.rid=String(r.id);          // flashNewRow() finds the created row by this
  if(state.flashId!=null && r.id===state.flashId) row.classList.add("ev-new");
  return row;
}
// Totals row closing a day. "Total" always sits in the second column, which reads as an indent.
function stSumRow(rows){
  const row=$("div","stsum");
  row.style.gridTemplateColumns=colTemplate();
  row.style.minWidth=colBodyPx()+"px";
  const fz=freezePlan();
  if(state.bulk){ const sp=$("div","stcell");          // spacer under the leading tick-box column
    if(fz.handle!=null) freezeCell(sp,fz.handle,!fz.cols.length);
    row.appendChild(sp); }
  const labelAt=tblCols.length>1?1:0;
  tblCols.forEach((c,i)=>{
    const def=COLDEF[c.k];
    const cell=$("div","stcell"+alignCls(c.align));
    if(def.sum){
      const v=rows.reduce((s,r)=>s+num(r[def.sum]),0);
      if(v) cell.textContent=String(Math.round(v*10)/10);
      else { cell.innerHTML=DASH; cell.className+=" roc"; }
    } else if(c.k==="flag"){
      const f=rows.filter(r=>dataFlags(r).length).length;
      if(f) cell.innerHTML='<span class="evflag">'+f+"</span>";
    } else if(i===labelAt){
      cell.appendChild($("span","lb","Total"));
    }
    if(i<fz.cols.length) freezeCell(cell,fz.cols[i],i===fz.cols.length-1);
    row.appendChild(cell);
  });
  return row;
}
// Per-supplier subtotal, sitting UNDER the rows it describes. Static on purpose: it is a read-out,
// not a control, so there is nothing to click and no folded state to remember. The supplier is not
// repeated in it - the rows above already carry the Supplier column.
function supTotalRow(grp){
  const h=$("div","supgrp");
  h.style.minWidth=colBodyPx()+"px";   // so its rule runs the table width, not the visible pane
  h.appendChild($("span","lb","Total"));
  h.appendChild($("span","gq",slabSum(grp)+" slabs"));
  return h;
}
function renderAgenda(byYmd,dayKeys){
  const list=document.getElementById("agenda"); list.className="agenda"; list.innerHTML=""; dayToggles=[];
  const todayK=ymd(new Date());
  const undated=undatedShown();

  if(!dayKeys.length && !undated.length){
    const q=(state.searchQ||"").trim(); const g=findGroup(state.statusFilter);
    list.appendChild($("div","ag-empty","No stone orders"+(q?(" matching “"+q+"”"):"")
      +(g&&g.key!=="all"?(" · "+g.label):"")+(state.assignee?(" for "+state.assignee):"")+"."));
    return;
  }
  list.appendChild(stColHead());

  // Undated rows can't sit in a day band, so they head the list under their own banner.
  if(undated.length){
    list.appendChild($("div","nodate","No date · "+slabSum(undated)+" slabs"));
    const body=$("div","strows");
    undated.forEach(r=>body.appendChild(stRow(r)));
    if(showTotals) body.appendChild(stSumRow(undated));
    list.appendChild(body);
  }

  dayKeys.forEach(k=>{
    const d=dateFromYmd(k);
    const evs=eventsOn(byYmd,d);
    if(!evs.length && k!==todayK) return;                 // today stays as an anchor
    const rows=evs.map(e=>e.r);
    const day=$("div","ag-day tbl"+(k===todayK?" today":""));
    day.style.minWidth=colRowPx()+"px";   // so the day-boundary rule runs the full table width
    const dc=$("div","ag-date");
    if(tblFreeze>=1) freezeCell(dc,0,tblFreeze===1);
    // Day number in a circle + weekday. The intense red is reserved for TODAY, so it is the one
    // thing that jumps out of the gutter; other days keep the same geometry in quiet neutrals.
    const chip=$("div","daychip"+(k===todayK?" today":""));
    chip.appendChild($("span","dtxt",DOW[(d.getDay()+6)%7]+" "+d.getDate()+" "
      +MONTHS[d.getMonth()].slice(0,3)+" "+d.getFullYear()));
    dc.appendChild(chip);
    if(state.bulk && rows.length){
      const ids=rows.map(r=>r.id);
      const tog=$("span","ag-all");
      tog.onclick=ev=>{ ev.stopPropagation();
        const all=ids.every(id=>state.sel.has(id));
        ids.forEach(id=>{ if(all) state.sel.delete(id); else state.sel.add(id); }); render(); };
      dayToggles.push({ el:tog, ids });
      dc.appendChild(tog);
    }
    // Whether the day has any orders at all, regardless of the current filters - drives the
    // empty-day copy and the double-click-to-create guard below.
    const dayAll=baseRows().filter(r=>{ const cd=calDateOf(r); return cd && ymd(cd.date)===k; });
    day.appendChild(dc);

    if(!rows.length){
      const e=$("div","ag-none", dayAll.length ? "Nothing matching on this day"
        : "No stone orders today. Double-click to add one.");
      e.ondblclick=ev=>{ if(dayAll.length) return; ev.preventDefault(); closePops(); openNew(d); };
      day.appendChild(e);
    } else {
      const body=$("div","strows");
      if(groupBySup){
        // Biggest supplier first, which is the order the old gutter summary used.
        const per={};
        rows.forEach(r=>{ const nm=supplierOf(r); (per[nm]=per[nm]||[]).push(r); });
        Object.keys(per).sort((a,b)=>slabSum(per[b])-slabSum(per[a])||a.localeCompare(b))
          .forEach(nm=>{
            per[nm].forEach(r=>body.appendChild(stRow(r)));
            body.appendChild(supTotalRow(per[nm]));                 // subtotal under its rows
          });
      } else {
        rows.forEach(r=>body.appendChild(stRow(r)));
      }
      if(showTotals) body.appendChild(stSumRow(rows));
      day.appendChild(body);
    }
    list.appendChild(day);
  });
}

// ---- data-cleanliness flags ----
// Half-filled delivery information is the thing that quietly rots this table, so each line is
// checked and the ones that don't add up get an exclamation mark on the calendar. Cancelled and
// N/A lines are exempt: a cancelled order legitimately has gaps.
function dataFlags(r){
  const s=String(r.Order_Status||"").trim();
  if(/cancel/i.test(s)||/^n\/a$/i.test(s)) return [];
  const out=[], hasDate=!!toDate(r.Delivery_Date), hasQty=!!num(r.Delivery_Qty);
  if(isDeliveredStatus(r)){                    // the more specific complaint wins
    if(!hasDate) out.push("Marked delivered but no delivery date");
    if(!hasQty)  out.push("Marked delivered but no delivered qty");
  } else if(hasDate&&!hasQty) out.push("Delivery date is set but no delivered qty");
  return out;
}
function flagEl(list){
  const b=$("span","evflag","!");
  b.title=list.join("\n");
  b.onclick=ev=>ev.stopPropagation();
  return b;
}
// Highlight/coloured-bar colour = the line's Order_Status colour (raw status hue, dark text).
function statusBar(r){ return { fill:statusColor(r.Order_Status), text:"#1d2733" }; }
// A status pill as an element, matching the Order status column's markup. Note openDay() below has
// always called this without it existing anywhere - harmless only because nothing calls openDay
// (dead code from before the table view). Defining it here de-fuses that too.
function pillEl(status){
  const el=$("span","evpill");
  el.style.borderColor="transparent"; el.style.color="#1d2733";
  el.style.background=statusColor(status);
  el.textContent=statusLabel(status);
  return el;
}

// ============================================================
//  INLINE CELL EDITING
// ============================================================
// Writes land in Grist as soon as the cell is committed, per how the team wants it. The write is
// debounced so holding a key does not fire one UpdateRecord per keystroke, and a failure puts the
// old value back rather than leaving the table disagreeing with the doc.
let cellTimer=null, cellQueue=[];
function queueCellWrite(update){
  cellQueue=cellQueue.filter(u=>!(u.id===update.id && Object.keys(u.fields)[0]===Object.keys(update.fields)[0]));
  cellQueue.push(update);
  if(cellTimer) clearTimeout(cellTimer);
  cellTimer=setTimeout(flushCellWrites,250);
}
async function flushCellWrites(){
  cellTimer=null;
  const batch=cellQueue; cellQueue=[];
  if(!batch.length) return;
  try{ await writeRows(batch); }
  catch(err){ console.error(err);
    await confirmBox("Couldn\u2019t save","Grist rejected the change: "
      +(err&&err.message?err.message:String(err))+" The table has been reloaded.",
      [{v:"ok",label:"OK",kind:"primary"}]);
    await refetch(); }
}
function startCellEdit(cell,r,c){
  const spec=COLDEF[c.k].edit; if(!spec) return;
  if(cell.querySelector("input,select")) return;
  const prev=cell.innerHTML;
  const was=r[spec.f];
  cell.innerHTML="";
  let el;
  if(spec.t==="choice"){
    el=document.createElement("select");
    const blank=document.createElement("option"); blank.value=""; blank.textContent="(to sort)";
    el.appendChild(blank);
    const seen=new Set();
    const opts=STATUS_ORDER.slice();
    if(r[spec.f] && !opts.includes(r[spec.f])) opts.unshift(r[spec.f]);
    opts.forEach(s=>{ if(!s||seen.has(s))return; seen.add(s);
      const o=document.createElement("option"); o.value=s; o.textContent=s; el.appendChild(o); });
    el.value=r[spec.f]==null?"":String(r[spec.f]);
  } else if(spec.t==="product"){
    // Same datalist pattern as the new-order picker: type to filter, only a real catalogue
    // product counts. Picking one updates the Stone label AND the Supplier, since both derive
    // from it. Choosing a supplier here means "the product of theirs you are ordering".
    const idx=productPicker();
    el=document.createElement("input"); el.type="text";
    el.setAttribute("autocomplete","off");
    el.placeholder=state.catalogue&&state.catalogue.length?"Type to search the catalogue…":"Catalogue not loaded";
    const cur=catFor(r);
    const curLabel=cur?String(cur[(state.ref.product&&state.ref.product.labelCol)||"Product_Full"]
                              ||cur.Product_Full||"").trim():"";
    el.value=curLabel;
    const dl=document.createElement("datalist"); dl.id="dl-cell-product";
    idx.labels.forEach(l=>{ const o=document.createElement("option"); o.value=l; dl.appendChild(o); });
    el.setAttribute("list",dl.id);
    cell.appendChild(dl);
    el.oninput=()=>{ const hit=idx.map[el.value.trim()];
      el.style.borderColor=(!el.value.trim()||hit!=null)?"":"var(--danger)"; };
    el._pickIdx=idx; el._curLabel=curLabel;
  } else {
    el=document.createElement("input");
    el.type = spec.t==="date" ? "date" : spec.t==="num" ? "number" : "text";
    if(spec.t==="num"){ el.min="0"; el.step="0.5"; }
    el.value = spec.t==="date" ? dateToInput(r[spec.f],state.colType[spec.f])
             : spec.t==="num"  ? (num(r[spec.f])||"")
             : (r[spec.f]==null?"":String(r[spec.f]));
  }
  cell.appendChild(el);
  el.focus(); if(el.select) try{ el.select(); }catch(e){}
  let done=false;
  const commit=()=>{
    if(done) return; done=true;
    const v=el.value;
    if(spec.t==="product"){
      const txt=String(v).trim();
      const id=el._pickIdx?el._pickIdx.map[txt]:null;
      // Nothing typed clears the link; an unrecognised name is refused rather than guessed at,
      // so a typo can never silently point a line at the wrong stone.
      if(txt && id==null){ cell.innerHTML=prev; return; }
      const wasId=refId(r.Product)||null, nextId=txt?id:null;
      if(String(nextId||"")===String(wasId||"")){ cell.innerHTML=prev; return; }
      r.Product=nextId;
      const c2=nextId?(state.catById[nextId]||null):null;
      // keep the derived read-outs in step until Grist recomputes the formula columns
      r.Product_Supplier=c2?(c2.Supplier||""):"";
      r.Product_Code=c2?(c2.Code||""):"";
      reindex(); render();
      const back=document.querySelector('[data-rid="'+r.id+'"][data-k="'+c.k+'"]');
      if(back) back.classList.add("saved");
      queueCellWrite({ id:r.id, fields:{ Product: nextId } });
      return;
    }
    const next = spec.t==="date" ? inputToGrist(v,state.colType[spec.f])
               : spec.t==="num"  ? (v===""?null:num(v))
               : (v===""?"":v);
    const same = spec.t==="date" ? (String(next??"")===String(was??""))
               : spec.t==="num"  ? (num(next)===num(was))
               : (String(next??"")===String(was??""));
    if(same){ cell.innerHTML=prev; return; }
    r[spec.f]=next;                                  // optimistic, so the table stays responsive
    reindex(); render();
    const again=document.querySelector('[data-rid="'+r.id+'"][data-k="'+c.k+'"]');
    if(again) again.classList.add("saved");
    queueCellWrite({ id:r.id, fields:{ [spec.f]: next } });
  };
  const cancel=()=>{ if(done) return; done=true; cell.innerHTML=prev; };
  el.onblur=commit;
  el.onkeydown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(); }
    else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); cancel(); }
  };
  if(spec.t==="choice") el.onchange=commit;
}

// ============================================================
//  JOB PANEL  (double-click a row)
// ============================================================
// Editable fields are whitelisted AND checked against state.writableJob, which the schema pass
// builds from Grist's own isFormula flags. That matters here: most of Jobs_Detail is formulas
// (Job_ID, Stones, Inst_Dates, the qty rollups, Suburb/State/Postcode, Month/Quarter/Year,
// Client_Label). Writing one of those silently does nothing, so they are shown read-only instead.
const JOB_FIELDS=[
  { col:"Client_Name",       lab:"Client",             kind:"ref"    },
  { col:"Job_Address",       lab:"Address",            kind:"text"   },
  { col:"Address_Formatted", lab:"Address (verified)", kind:"text"   },
  { col:"Stage",             lab:"Stage",              kind:"choice" },
  { col:"Payment_Status",    lab:"Payment",            kind:"choice" },
  { col:"Assigned_To",       lab:"Assigned to",        kind:"chips"  },
  { col:"Meas_Date",         lab:"Measure date",       kind:"date"   },
  { col:"Input_Date",        lab:"Input date",         kind:"date"   },
  { col:"Cash",              lab:"Cash",               kind:"text"   },
  { col:"Note",              lab:"Note",               kind:"area"   }
];
// Read-outs worth showing, in the order the team reads them.
const JOB_READONLY=[
  ["Job_ID","Job ID"],["Stones","Stones"],["Inst_Dates","Install date(s)"],
  ["Scope_Qty","Scope qty"],["Ordered_Qty","Ordered qty"],["In_WH_Qty","In WH qty"],
  ["Suburb","Suburb"],["State","State"],["Postcode","Postcode"],["Month","Month"]
];
const jobWritable=col=>!state.grist || !!(state.writableJob&&state.writableJob[col]);

function jobChoiceList(col){
  const m=state.jobChoices&&state.jobChoices[col];
  if(m&&Array.isArray(m.choices)&&m.choices.length) return m.choices.slice();
  // demo, or metadata not in yet: fall back to whatever the loaded jobs actually use
  const seen={}, out=[];
  (state.jobs||[]).forEach(j=>{ const v=j[col];
    (Array.isArray(v)?choiceList(v):[v]).forEach(x=>{ const t=String(x||"").trim();
      if(t && !seen[t]){ seen[t]=1; out.push(t); } }); });
  return out;
}
function writeJob(job,col,val){
  job[col]=val;                                      // optimistic, so the panel stays responsive
  if(!state.grist){ reindex(); render(); return Promise.resolve(); }
  if(!jobWritable(col)) return Promise.resolve();     // never write a formula column
  return grist.docApi.applyUserActions([["UpdateRecord","Jobs_Detail",job.id,{[col]:val}]])
    .then(()=>refetch())
    .catch(e=>{ console.warn("job write failed",e); });
}
function jobSaved(host){
  if(!host) return;
  const t=$("span","jp-saved","Saved"); host.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); },1200);
}
function openJobPanel(job){
  if(!job) return;
  state.jobOpen=job.id;
  const body=document.getElementById("jobBody"); body.innerHTML="";
  document.getElementById("jobTab").textContent="Job "+(job.Job_ID||("#"+job.id));
  body.appendChild($("div","se-head",jobClient(job)));
  body.appendChild($("div","jp-note","Changes save as you leave each field. Greyed values are "
    +"calculated by Grist and cannot be typed over."));

  const grid=$("div","se-grid");
  JOB_FIELDS.forEach(f=>{
    const ro=!jobWritable(f.col);
    grid.appendChild($("div","se-lab",f.lab));
    if(f.kind==="chips"){
      const wrap=$("div","se-chips");
      jobChoiceList(f.col).forEach(n=>{
        const b=document.createElement("button"); b.type="button"; b.className="se-chip";
        b.textContent=n; if(choiceList(job[f.col]).indexOf(n)>-1) b.classList.add("on");
        b.disabled=ro;
        b.onclick=()=>{ const list=choiceList(job[f.col]).slice();
          const i=list.indexOf(n); if(i<0) list.push(n); else list.splice(i,1);
          b.classList.toggle("on",i<0);
          writeJob(job,f.col,["L"].concat(list)).then(()=>jobSaved(wrap)); };
        wrap.appendChild(b);
      });
      if(!wrap.children.length) wrap.appendChild($("span","jp-note","No names on file yet."));
      grid.appendChild(wrap); return;
    }
    if(f.kind==="ref"){
      // the Client ref: the same picker the new-order form uses, so only a real client can be set
      const lc=(state.ref.client&&state.ref.client.labelCol)||"Client_Name";
      const idx=pickerIndex(state.clients||[],c=>c[lc]);
      const inp=document.createElement("input"); inp.className="se-in";
      inp.value=String(job.Client_Label||"").trim(); inp.setAttribute("autocomplete","off");
      inp.placeholder=(state.clients||[]).length?"Type to search clients\u2026":"Clients not loaded";
      inp.disabled=ro;
      const dl=document.createElement("datalist"); dl.id="dl-job-client";
      idx.labels.forEach(l=>{ const o=document.createElement("option"); o.value=l; dl.appendChild(o); });
      inp.setAttribute("list",dl.id);
      inp.oninput=()=>{ const hit=idx.map[inp.value.trim()];
        inp.style.borderColor=(!inp.value.trim()||hit!=null)?"":"var(--danger)"; };
      inp.onblur=()=>{ const txt=inp.value.trim(), hit=idx.map[txt];
        // an unknown name is refused rather than guessed at, same rule as the product picker
        if(txt && hit==null){ inp.value=String(job.Client_Label||"").trim(); inp.style.borderColor=""; return; }
        const nextId=txt?hit:null;
        if(String(nextId||"")===String(refId(job.Client_Name)||"")) return;
        job.Client_Label=txt;
        writeJob(job,"Client_Name",nextId).then(()=>jobSaved(grid));
      };
      grid.appendChild(inp); grid.appendChild(dl); return;
    }
    if(f.kind==="choice"){
      const sel=document.createElement("select"); sel.className="se-in"; sel.disabled=ro;
      const blank=document.createElement("option"); blank.value=""; blank.textContent="(none)";
      sel.appendChild(blank);
      const opts=jobChoiceList(f.col);
      const cur=job[f.col]==null?"":String(job[f.col]);
      if(cur && opts.indexOf(cur)<0) opts.unshift(cur);       // keep an off-list value visible
      opts.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o); });
      sel.value=cur;
      // Compare against the live value each time, not the one captured at render: otherwise a
      // second edit of the same field, or changing a value and back again, is wrongly ignored.
      sel.onchange=()=>{ const live=job[f.col]==null?"":String(job[f.col]);
        if(sel.value===live) return;
        writeJob(job,f.col,sel.value||"").then(()=>jobSaved(grid)); };
      grid.appendChild(sel); return;
    }
    const el=document.createElement(f.kind==="area"?"textarea":"input");
    el.className="se-in"; el.disabled=ro;
    if(f.kind==="area"){ el.rows=3; el.style.resize="vertical"; }
    else el.type = f.kind==="date" ? "date" : "text";
    const shown=()=> f.kind==="date" ? dateToInput(job[f.col],state.jobColType[f.col])
                                     : (job[f.col]==null?"":String(job[f.col]));
    el.value=shown();
    el.onblur=()=>{ if(el.value===shown()) return;     // live value, so re-blurring is a no-op
      const next = f.kind==="date" ? inputToGrist(el.value,state.jobColType[f.col]) : el.value;
      writeJob(job,f.col,next).then(()=>jobSaved(grid)); };
    grid.appendChild(el);
  });
  body.appendChild(grid);

  const ros=JOB_READONLY.filter(([c])=>job[c]!=null && String(job[c]).trim()!=="" && String(job[c])!=="0");
  if(ros.length){
    const sec=$("div","jp-sec"); sec.appendChild($("div","jp-cap","Calculated by Grist"));
    const g2=$("div","jp-ro");
    ros.forEach(([c,lab])=>{ g2.appendChild($("div","k",lab));
      g2.appendChild($("div","v",String(job[c]))); });
    sec.appendChild(g2); body.appendChild(sec);
  }

  // every stone order on this job, with the one you came from marked
  const mine=(state.stone||[]).filter(r=>refId(r.Job)===job.id);
  const sec2=$("div","jp-sec");
  sec2.appendChild($("div","jp-cap",mine.length+(mine.length===1?" stone order":" stone orders")
    +" \u00b7 "+slabSum(mine)+" slabs"));
  const list=$("div","jp-lines");
  mine.forEach(r=>{
    const row=$("div","jp-line"+(state.jobFromRow===r.id?" here":""));
    row.appendChild(pillEl(r.Order_Status));
    row.appendChild($("span","nm",stoneLabel(r)));
    row.appendChild($("span","q",num(r.Scope_Qty)+"/"+num(r.Ordered_Qty)+"/"+num(r.Delivery_Qty)));
    list.appendChild(row);
  });
  if(!mine.length) list.appendChild($("div","jp-note","No stone orders on this job yet."));
  sec2.appendChild(list); body.appendChild(sec2);

  document.getElementById("jobModal").classList.add("open");
}
function closeJobPanel(){
  document.getElementById("jobModal").classList.remove("open");
  state.jobOpen=null; state.jobFromRow=null;
}

// ============================================================
//  REMOVE AN ORDER
// ============================================================
// Three ways out, because a delete cannot be undone from the widget: change the status and keep
// the record, delete the row outright, or back out. Changing the status is the primary action.
async function askRemove(r){
  const j=jobFor(r);
  const suggested = /cancel/i.test(String(r.Order_Status||"")) ? "N/A" : "Cancelled";
  const choice=await confirmBox("Remove this stone order?",
    jobClient(j)+" \u00b7 "+stoneLabel(r)+" \u00b7 "+slabsOf(r)+" slab"+(slabsOf(r)===1?"":"s")
      +" \u00b7 "+statusLabel(r.Order_Status)
      +(toDate(r.Order_Date)?(", dated "+fmtDMY(r.Order_Date)):", undated")+"."
      +"\n\nChanging the status to \u201c"+suggested+"\u201d keeps the record and its history."
      +" Deleting removes the row from Grist, and the widget cannot undo it.",
    [{v:"discard",label:"Discard"},
     {v:"status",label:"Change to "+suggested,kind:"primary"},
     {v:"delete",label:"Delete order"}]);
  if(choice==="status") await setRowStatus(r,suggested);
  else if(choice==="delete") await deleteRow(r);
}
async function setRowStatus(r,v){
  try{ await writeRows([{ id:r.id, fields:{ Order_Status:v } }]); }
  catch(err){ console.error(err);
    await confirmBox("Couldn\u2019t save","Grist rejected the change: "
      +(err&&err.message?err.message:String(err)),[{v:"ok",label:"OK",kind:"primary"}]); }
}
async function deleteRow(r){
  if(!state.grist){
    const i=state.stone.findIndex(x=>x.id===r.id);
    if(i>=0) state.stone.splice(i,1);
    reindex(); render(); return;
  }
  try{
    await grist.docApi.applyUserActions([["RemoveRecord","Stone_Order",r.id]]);
    state.sel.delete(r.id);
    await refetch();
  }catch(err){ console.error(err);
    await confirmBox("Couldn\u2019t remove","Grist rejected the removal: "
      +(err&&err.message?err.message:String(err)),[{v:"ok",label:"OK",kind:"primary"}]); }
}

// ---- card editor modal ----
let colPanelOpen=false;
function toggleColEditor(){
  colPanelOpen=!colPanelOpen;
  document.getElementById("colsBtn").classList.toggle("on",colPanelOpen);
  renderColEditor();
}
function closeColEditor(){
  colPanelOpen=false;
  document.getElementById("colsBtn").classList.remove("on");
  renderColEditor();
}
// Reorder by index, the one place the column order changes, so drag and any future control
// share it.
function moveCol(from,to){
  if(from===to||from<0||to<0||from>=tblCols.length||to>tblCols.length) return false;
  const item=tblCols.splice(from,1)[0];
  tblCols.splice(from<to?to-1:to,0,item);
  saveTablePrefs(); render();
  return true;
}
let dragFrom=null;
// One row per column: heading (fixed, it names the field), whether cells are editable, bold /
// italic / underline, plain or pill, alignment, width. Drag a row to move the column.
function renderColEditor(){
  const box=document.getElementById("colPanel");
  box.className="colpanel"+(colPanelOpen?" open":"");
  if(!colPanelOpen){ box.innerHTML=""; return; }
  box.innerHTML='<h4>Columns shown, left to right</h4>'
    +'<div class="cphint">Drag a row to move the column. Headings are fixed because a heading '
    +'names the Grist field the column reads. <b>Editable</b> columns can be changed straight '
    +'in the table.</div>';

  // width of the date column, and the table's font size
  const set=$("div","cpset");
  const stepper=(label,get,set2,fmt,step,lo,hi)=>{
    const grp=$("div","grp");
    grp.appendChild($("span","lab",label));
    const w=$("div","ce-wstep");
    const mk=(txt,delta,title)=>{ const b=document.createElement("button"); b.type="button";
      b.className="ce-fbtn"; b.textContent=txt; b.title=title;
      b.onclick=()=>{ set2(Math.max(lo,Math.min(hi,Math.round((get()+delta)*10)/10)));
        saveTablePrefs(); render(); renderColEditor(); };
      return b; };
    w.appendChild(mk("−",-step,"Smaller"));
    w.appendChild($("span","ce-fval",fmt(get())));
    w.appendChild(mk("+",step,"Larger"));
    grp.appendChild(w); return grp;
  };
  set.appendChild(stepper("Date column",()=>dateColW,v=>{dateColW=v;},v=>v+"px",10,120,360));
  set.appendChild(stepper("Font size",()=>tblFont,v=>{tblFont=v;},v=>v+"px",0.5,9.5,18));
  box.appendChild(set);

  const tog=document.createElement("label"); tog.className="coltog";
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=showTotals;
  cb.onchange=()=>{ showTotals=cb.checked; saveTablePrefs(); render(); };
  tog.appendChild(cb);
  tog.appendChild(document.createTextNode("Show a total row under each day"));
  box.appendChild(tog);

  const commit=()=>{ saveTablePrefs(); render(); };

  tblCols.forEach((c,i)=>{
    const def=COLDEF[c.k];
    const row=$("div","colrow");
    row.draggable=true;
    row.dataset.i=String(i);

    row.ondragstart=ev=>{ dragFrom=i; row.classList.add("dragging");
      try{ ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain",String(i)); }catch(e){} };
    row.ondragend=()=>{ dragFrom=null;
      [...box.querySelectorAll(".colrow")].forEach(x=>x.classList.remove("dragging","dropbefore","dropafter")); };
    row.ondragover=ev=>{ if(dragFrom==null||dragFrom===i) return;
      ev.preventDefault();
      const r=row.getBoundingClientRect();
      const after=(ev.clientY-r.top)>r.height/2;
      row.classList.toggle("dropbefore",!after);
      row.classList.toggle("dropafter",after); };
    row.ondragleave=()=>row.classList.remove("dropbefore","dropafter");
    row.ondrop=ev=>{
      ev.preventDefault();
      const after=row.classList.contains("dropafter");
      row.classList.remove("dropbefore","dropafter");
      if(dragFrom==null) return;
      const target=after?i+1:i;
      const from=dragFrom; dragFrom=null;
      if(moveCol(from,target)) renderColEditor();
    };

    row.appendChild($("span","grip","⠿"));
    const nm=$("div","colname"+(def.label?"":" none"), def.label||"(no heading)");
    nm.title="The heading is the field this column reads";
    row.appendChild(nm);
    const tag=$("span","rotag"+(def.edit?" can":""), def.edit?"editable":"read-only");
    tag.title=def.edit?"Cells can be edited in the table":"Comes from the job or the catalogue";
    row.appendChild(tag);

    const fmt=$("div","fmtseg");
    [["b","B","fb","Bold"],["i","I","fi","Italic"],["u","U","fu","Underline"]].forEach(spec=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=spec[1];
      b.className=spec[2]+(c[spec[0]]?" on":""); b.title=spec[3];
      b.onclick=()=>{ c[spec[0]]=!c[spec[0]]; commit(); renderColEditor(); };
      fmt.appendChild(b); });
    row.appendChild(fmt);

    const st=$("div","miniseg");
    [["plain","Plain"],["pill","Pill"]].forEach(spec=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=spec[1];
      if(c.style===spec[0]) b.className="on";
      b.onclick=()=>{ c.style=spec[0]; commit(); renderColEditor(); };
      st.appendChild(b); });
    row.appendChild(st);

    const al=$("div","miniseg");
    [["left","L","Left"],["centre","C","Centre"],["right","R","Right"]].forEach(spec=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=spec[1]; b.title=spec[2];
      if(c.align===spec[0]) b.className="on";
      b.onclick=()=>{ c.align=spec[0]; commit(); renderColEditor(); };
      al.appendChild(b); });
    row.appendChild(al);

    const sp=document.createElement("span"); sp.style.flex="1 1 auto"; row.appendChild(sp);

    const wrap=$("div","ce-wstep");
    const minus=document.createElement("button"); minus.type="button"; minus.className="ce-fbtn";
    minus.textContent="−"; minus.title="Narrower";
    minus.onclick=()=>{ c.w=Math.max(30,c.w-14); commit(); renderColEditor(); };
    const val=$("span","ce-fval",c.w+"px");
    const plus=document.createElement("button"); plus.type="button"; plus.className="ce-fbtn";
    plus.textContent="+"; plus.title="Wider";
    plus.onclick=()=>{ c.w=Math.min(320,c.w+14); commit(); renderColEditor(); };
    wrap.appendChild(minus); wrap.appendChild(val); wrap.appendChild(plus);
    row.appendChild(wrap);

    const rm=$("span","ce-sec-x"+(tblCols.length<=1?" off":""),"×"); rm.title="Remove column";
    rm.onclick=()=>{ if(tblCols.length>1){ tblCols.splice(i,1); commit(); renderColEditor(); } };
    row.appendChild(rm);
    box.appendChild(row);
  });

  // Freeze panes: a contiguous block from the left, so the choice is "how far", not "which".
  box.insertAdjacentHTML("beforeend",'<h4>Freeze while scrolling</h4>');
  const fzrow=$("div","ce-freeze");
  const seg=$("div","miniseg");
  const maxN=Math.min(4,tblCols.length);
  const opts=[[0,"None","Nothing stays put"],[1,"Date","The date column stays put"]];
  for(let n=1;n<=maxN;n++){
    opts.push([n+1,"Date +"+n,"Date and the first "+n+" column"+(n===1?"":"s")
      +" stay put: "+tblCols.slice(0,n).map(c=>COLDEF[c.k].label||"Flag").join(", ")]);
  }
  opts.forEach(o=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=o[1]; b.title=o[2];
    if(tblFreeze===o[0]) b.className="on";
    b.onclick=()=>{ tblFreeze=o[0]; commit(); renderColEditor(); };
    seg.appendChild(b);
  });
  fzrow.appendChild(seg);
  fzrow.appendChild($("span","ce-hint","Frozen columns stay in view when the table scrolls sideways."));
  box.appendChild(fzrow);

  const rest=Object.keys(COLDEF).filter(k=>!tblCols.some(c=>c.k===k));
  if(rest.length){
    box.insertAdjacentHTML("beforeend",'<h4>Add a column</h4>');
    const av=$("div","ce-tokens");
    rest.forEach(k=>{
      const b=document.createElement("button"); b.type="button"; b.className="ce-tok";
      b.textContent="+ "+(COLDEF[k].label||"Flag");
      b.onclick=()=>{ tblCols.push(mkCol(k)); commit(); renderColEditor(); };
      av.appendChild(b); });
    box.appendChild(av);
  }

  const foot=$("div","cpfoot");
  const msg=$("div","msg");
  const setMsg=m=>{ msg.textContent = m || (colScope==="me"
    ? "Saved just for you. Everyone else keeps the shared columns."
    : "These columns are shared with everyone using this widget."); };
  setMsg(); foot.appendChild(msg);
  const bMe=document.createElement("button"); bMe.type="button"; bMe.className="ce-save ghost";
  bMe.textContent="Save just for me";
  bMe.onclick=()=>{ colScope="me"; saveTablePrefs(); setMsg("Saved. Just for you."); };
  const bAll=document.createElement("button"); bAll.type="button"; bAll.className="ce-save primary";
  bAll.textContent="Save for everyone";
  bAll.onclick=()=>{ colScope="everyone"; publishTableCols(); saveTablePrefs(); setMsg("Saved. Shared with everyone."); };
  const bClose=document.createElement("button"); bClose.type="button"; bClose.className="ce-save ghost";
  bClose.textContent="Done"; bClose.onclick=closeColEditor;
  foot.appendChild(bMe); foot.appendChild(bAll); foot.appendChild(bClose);
  box.appendChild(foot);
}

// The fields the card can show and an operator would actually change on the day. Status is a
// live choice list from the Grist column, so it always matches the Stone Order page.
const EDIT_FIELDS=[
  { col:"Order_Status",  label:"Status",       kind:"status" },
  { col:"Scope_Qty",     label:"Scope qty",    kind:"num" },
  { col:"Ordered_Qty",   label:"Ordered qty",  kind:"num" },

];
// jobMode "existing" picks a job from the list; "new" creates the client + job on the way in,
// which is what the retired Catalogue Search wizard did (every order must tie to a job).
function blankEdit(over){
  return Object.assign({ id:null, orig:{}, cur:{}, mode:"edit", job:"", product:"",
    jobMode:"existing", clientName:"", clientId:null, address:"", assignees:[] }, over||{});
}
let edit=blankEdit();
function editDirty(){
  if(edit.mode==="new") return true;                 // a new order is always "unsaved"
  return EDIT_FIELDS.some(f=>String(edit.cur[f.col]??"")!==String(edit.orig[f.col]??""));
}
function openEdit(r){
  edit=blankEdit({ id:r.id, mode:"edit" });
  EDIT_FIELDS.forEach(f=>{
    const v = f.kind==="date" ? dateToInput(r[f.col],state.colType[f.col])
            : f.kind==="num"  ? (num(r[f.col])||"")
            : (r[f.col]==null?"":String(r[f.col]));
    edit.orig[f.col]=v; edit.cur[f.col]=v;
  });
  renderEdit(r);
  document.getElementById("editModal").classList.add("open");
}
// New stone order, optionally pre-dated to the day that was double-clicked. A line with no
// order or delivery date never appears on the calendar (see calDateOf), so the order date is
// pre-filled and one of the two is required before saving.
function openNew(d){
  edit=blankEdit({ mode:"new" });
  EDIT_FIELDS.forEach(f=>{ edit.orig[f.col]=""; edit.cur[f.col]=""; });
  edit.cur.Order_Date=dateToInput(dateToGrist(d||new Date(),state.colType.Order_Date),state.colType.Order_Date);
  if(STATUS_ORDER.includes("Awaiting Order")) edit.cur.Order_Status="Awaiting Order";
  renderEdit(null);
  document.getElementById("editModal").classList.add("open");
}
// Label -> row id for a picker, with the row id appended only where a label repeats, so the
// common case stays clean and duplicates stay distinguishable.
function pickerIndex(rows,labelOf){
  const seen={}, out=[];
  rows.forEach(row=>{ const base=String(labelOf(row)||"").trim(); if(!base) return;
    seen[base]=(seen[base]||0)+1; out.push({ id:row.id, base }); });
  const map={}, labels=[];
  out.forEach(o=>{ const label = seen[o.base]>1 ? (o.base+" #"+o.id) : o.base;
    if(map[label]==null){ map[label]=o.id; labels.push(label); } });
  labels.sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  return { map, labels };
}
function jobPicker(){ return pickerIndex(state.jobs||[],j=>{
  const c=jobClient(j), code=jobCode(j), addr=String(j.Job_Address||j.Address_Formatted||"").trim();
  return c+(code?(" ("+code+")"):"")+(addr&&addr!==c?(" - "+addr):""); }); }
function productPicker(){ const lc=(state.ref.product&&state.ref.product.labelCol)||"Product_Full";
  return pickerIndex(state.catalogue||[],c=>c[lc]||c.Product_Full||("#"+c.id)); }
// A datalist-backed text box: type to filter, but only a value from the list counts.
function pickerRow(grid,label,idx,initial,onPick){
  grid.appendChild($("div","se-lab",label));
  const input=document.createElement("input"); input.className="se-in"; input.value=initial||"";
  input.placeholder="Type to search…"; input.setAttribute("autocomplete","off");
  const dl=document.createElement("datalist"); dl.id="dl-"+label.replace(/\W+/g,"");
  idx.labels.forEach(l=>{ const o=document.createElement("option"); o.value=l; dl.appendChild(o); });
  input.setAttribute("list",dl.id);
  input.oninput=()=>{ const id=idx.map[input.value.trim()];
    input.style.borderColor = (!input.value.trim()||id!=null) ? "" : "var(--danger)";
    onPick(id!=null?id:null,input.value); updateEditFoot(); };
  grid.appendChild(input); grid.appendChild(dl);
}
// Like pickerRow but the typed value stands on its own: suggestions only assist, anything
// goes. Used for the customer (an unknown name means "create it") and the address.
function freeRow(grid,label,suggestions,initial,placeholder,onType){
  grid.appendChild($("div","se-lab",label));
  const input=document.createElement("input"); input.className="se-in"; input.value=initial||"";
  input.placeholder=placeholder||""; input.setAttribute("autocomplete","off");

    const dl=document.createElement("datalist"); dl.id="dl-"+label.replace(/\W+/g,"");

    input.setAttribute("list",dl.id); grid.appendChild(input); grid.appendChild(dl);

// What still has to be filled in before a new order can be created. Both dates empty is
// disallowed because such a line would exist in Grist but never show on the calendar.
function newBlockers(){
  const miss=[];
  if(edit.jobMode==="new"){
    // A job needs something to identify it by. The old Catalogue Search wizard took either,
    // so a walk-in with only an address still gets a job.
    if(!String(edit.clientName||"").trim() && !String(edit.address||"").trim()) miss.push("a customer or an address");
  } else if(!edit.job) miss.push("a job");
  if(!edit.product) miss.push("a stone");
  if(!edit.cur.Order_Date && !edit.cur.Delivery_Date) miss.push("an order or delivery date");
  return miss;
}
function updateEditFoot(){
  const f=document.getElementById("seDirty"), s=document.getElementById("seSave");
  let ok, note;
  if(edit.mode==="new"){ const miss=newBlockers(); ok=!miss.length; note=ok?"":("Needs "+miss.join(", ")); }
  else { ok=editDirty(); note=ok?"Unsaved changes":""; }
  if(f) f.textContent=note;
  if(s) s.disabled=!ok, s.style.opacity=ok?"":".5", s.style.cursor=ok?"pointer":"default";
}
// Build only the fields that actually changed, so a save never rewrites untouched columns.
function editUpdate(){
  const fields={};
  EDIT_FIELDS.forEach(f=>{
    const cur=edit.cur[f.col], was=edit.orig[f.col];
    if(String(cur??"")===String(was??"")) return;
    fields[f.col] = f.kind==="date" ? inputToGrist(cur,state.colType[f.col])
                  : f.kind==="num"  ? (cur===""?null:num(cur))
                  : (cur===""?null:cur);
  });
  return Object.keys(fields).length?{ id:edit.id, fields }:null;
}
// Fields for a brand-new line: the two refs, the stone's name as free text, and whatever
// was typed in. Product_Code / Product_Supplier are deliberately NOT written: they are
// formula columns off Product, and Grist rejects the whole action if you try.
function newFields(jobId){
  const fields={ Job:jobId, Product:edit.product };
  EDIT_FIELDS.forEach(f=>{
    const cur=edit.cur[f.col]; if(cur===""||cur==null) return;
    fields[f.col] = f.kind==="date" ? inputToGrist(cur,state.colType[f.col])
                  : f.kind==="num"  ? num(cur)
                  : cur;
  });
  // Stone is the FALLBACK name for a line with no Product, nothing more. The only formula in
  // the doc that reads it is Jobs_Detail.Stones, and only as "r.Product.Product_Full if
  // r.Product else r.Stone" - so with a Product set, writing Stone would just freeze a stale
  // copy of the catalogue name that stoneHaystack() then searches. Left blank on purpose,
  // which is what 229 of the 399 existing rows already do.
  if(!edit.product){ const nm=catStoneName(state.catById[edit.product]); if(nm) fields.Stone=nm; }
  // never write a formula column, and never invent one the doc doesn't have
  if(state.writable) Object.keys(fields).forEach(k=>{ if(!state.writable[k]) delete fields[k]; });
  return fields;
}
// The stone's own name, preferring the column the Product ref displays.
function catStoneName(cat){ if(!cat) return null;
  const lc=(state.ref.product&&state.ref.product.labelCol)||"Product_Full";
  for(const k of [lc,"Product_Full","Name","Stone","Product"]){

// Create a record and resolve to its new rowId (Grist hands it back in retValues[0]).
async function addRecord(table,fields){
  if(!state.grist){
    const bag={ Stone_Order:state.stone, Jobs_Detail:state.jobs, Catalogue:state.catalogue }[table]
      || (state.ref.client&&table===state.ref.client.targetTableId&&state.clients)
      || (state.ref.product&&table===state.ref.product.targetTableId&&state.catalogue) || [];
    const id=bag.reduce((m,r)=>Math.max(m,typeof r.id==="number"?r.id:0),0)+1;
    bag.push(Object.assign({ id },fields)); reindex();
    return id;
  }
  const res=await grist.docApi.applyUserActions([["AddRecord",table,null,fields]]);
  return ((res&&res.retValues)||[])[0];
}
// Reuse an existing client by name (case-insensitive) or add one. Resolves to its rowId,
// or null when the doc has no Client ref to hang it off.
async function ensureClient(name){
  const R=state.ref.client, nm=String(name||"").trim();
  if(!nm||!R) return null;
  const hit=(state.clients||[]).find(c=>String(clientLabel(c)).toLowerCase()===nm.toLowerCase());
  if(hit) return hit.id;
  const f={}; f[R.labelCol]=nm;
  return addRecord(R.targetTableId,f);
}
// A new job from the panel's step-1 fields. Stage is deliberately NOT set: Jobs_Detail.Stage
// is a trigger formula ("Quote", on new records), so the doc already owns that default and
// hardcoding it here would fight any later change to it.
async function createJob(){
  const clientId=await ensureClient(edit.clientName);
  const nm=String(edit.clientName||"").trim(), addr=String(edit.address||"").trim();
  const f={};
  if(clientId!=null) f.Client_Name=clientId;
  if(addr) f.Job_Address=addr;
  else if(clientId==null && nm) f.Job_Address=nm;      // no Client table: keep the name somewhere
  if((edit.assignees||[]).length) f.Assigned_To=["L",...edit.assignees];
  if(!state.grist && nm) f.Client_Label=nm;            // mirror the formula so the demo reads right
  if(state.writableJob) Object.keys(f).forEach(k=>{ if(!state.writableJob[k]) delete f[k]; });
  const id=await addRecord("Jobs_Detail",f);
  if(id==null) throw new Error("the job could not be created");

async function createRow(){

// Delivered qty follows the order number, per how the team works, falling back to the scope
// qty for the suppliers we never place an order with (WF, Aboda, client-supplied).
function bulkDeliveryQty(r){ return num(r.Ordered_Qty)||num(r.Scope_Qty)||null; }
async function applyBulk(){
  const status=document.getElementById("bulkStatus").value;
  const dateStr=document.getElementById("bulkDate").value;
  if(!status && !dateStr){
    await confirmBox("Nothing to apply","Pick a status or a delivery date first.",[{v:"ok",label:"OK",kind:"primary"}]);
    return;
  }
  const rows=(state.stone||[]).filter(r=>state.sel.has(r.id));
  if(!rows.length) return;
  const marksDelivered=!!status && isDeliveredStatus({Order_Status:status});
  const bits=[]; if(status) bits.push('status "'+status+'"'); if(dateStr) bits.push("delivery date "+fmtDMY(inputToGrist(dateStr,"Date")));
  const qtyNote=(marksDelivered||dateStr)?" Delivered qty is set to match the order number (or the scope qty where nothing was ordered).":"";
  const ok=await confirmBox("Apply to "+rows.length+" stone order"+(rows.length===1?"":"s")+"?",
    "Set "+bits.join(" and ")+" on "+rows.length+" selected order"+(rows.length===1?"":"s")+"."+qtyNote,
    [{v:"cancel",label:"Cancel"},{v:"go",label:"Apply",kind:"primary"}]);
  if(ok!=="go") return;
  const updates=rows.map(r=>{
    const fields={};
    if(status) fields.Order_Status=status;
    if(dateStr) fields.Delivery_Date=inputToGrist(dateStr,state.colType.Delivery_Date);
    if(marksDelivered||dateStr){ const q=bulkDeliveryQty(r); if(q!=null) fields.Delivery_Qty=q; }
    return { id:r.id, fields };
  });
  const apply=document.getElementById("bulkApply"); apply.disabled=true; apply.textContent="Saving…";
  try{ await writeRows(updates); setBulk(false); }
  catch(err){ console.error(err);
    await confirmBox("Couldn’t save","Grist rejected the change: "+(err&&err.message?err.message:String(err)),
      [{v:"ok",label:"OK",kind:"primary"}]); }
  finally{ apply.disabled=false; apply.textContent="Apply"; renderBulkBar(); }
}

async function loadGristSchema(){
  const [T,C]=await Promise.all([grist.docApi.fetchTable("_grist_Tables"), grist.docApi.fetchTable("_grist_Tables_column")]);
  const tables=columnarToRows(T), cols=columnarToRows(C);
  const tableById={}; tables.forEach(t=>tableById[t.tableId]=t);
  const colByRowId={}; cols.forEach(c=>colByRowId[c.id]=c);
  const colsOf=tid=>{ const t=tableById[tid]; return t?cols.filter(c=>c.parentId===t.id):[]; };
  const isEditable=c=>!c.isFormula && c.colId && !SPECIAL_COL.test(c.colId);
  const bestLabelCol=tid=>{ const cs=colsOf(tid).filter(isEditable);
    return ((cs.find(c=>/full|name|title|label|desc/i.test(c.colId))||cs.find(c=>(c.type||"").startsWith("Text"))||cs[0]||{}).colId)||null; };
  function refInfo(parentTableId,colId){
    const col=colsOf(parentTableId).find(c=>c.colId===colId); if(!col)return null;
    const mt=/^Ref(?:List)?:(.+)$/.exec(col.type||""); if(!mt)return null;
    const targetTableId=mt[1], vis=col.visibleCol&&colByRowId[col.visibleCol];
    return { colId, targetTableId, labelCol:(vis&&vis.colId)||bestLabelCol(targetTableId) };
  }
  // the live Order_Status choice list + per-choice colours, straight from the column def
  function choiceModel(parentTableId,colId){
    const col=colsOf(parentTableId).find(c=>c.colId===colId); if(!col)return null;
    let wo={}; try{ wo=JSON.parse(col.widgetOptions||"{}")||{}; }catch(e){ return null; }
    return { choices:wo.choices||[], options:wo.choiceOptions||{} };
  }
  // colId -> Grist type for one table, so date writes match the column (Date vs DateTime)
  function typeMap(parentTableId){ const m={}; colsOf(parentTableId).forEach(c=>{ if(c.colId) m[c.colId]=c.type||""; }); return m; }
  // Columns we must never write to: formulas, and anything the doc doesn't actually have.
  function writableCols(parentTableId){ const s={};
    colsOf(parentTableId).forEach(c=>{ if(isEditable(c)) s[c.colId]=true; }); return s; }
  return { refInfo, choiceModel, typeMap, writableCols };
}
async function pullTables(){
  const [so,jd]=await Promise.all([grist.docApi.fetchTable("Stone_Order"), grist.docApi.fetchTable("Jobs_Detail")]);
  state.stone=columnarToRows(so); state.jobs=columnarToRows(jd);
  if(state.ref.product){ try{ const cat=await grist.docApi.fetchTable(state.ref.product.targetTableId); state.catalogue=columnarToRows(cat); }catch(e){} }
  // Clients only feed the "new job" customer picker, so a failure here is not fatal.
  if(state.ref.client){ try{ const cl=await grist.docApi.fetchTable(state.ref.client.targetTableId); state.clients=columnarToRows(cl); }catch(e){} }
  reindex();
}

// Manual refresh. Plain click re-reads every table from the doc, which covers the usual case of
// someone else having edited rows in Grist. Shift-click reloads the widget FILE itself with a
// cache-busting query, which is what is actually needed after a redeploy — the Grist iframe caches
// the HTML hard enough that a normal browser refresh often keeps serving the old build.
async function hardRefresh(reloadFile){
  const btn=document.getElementById("reloadBtn");
  if(reloadFile){
    const u=location.pathname+"?r="+Date.now();
    location.replace(u);
    return;
  }
  const label=btn.textContent;
  btn.disabled=true; btn.textContent="↻ Refreshing…";
  try{
    if(state.grist) await pullTables();
    render();
    btn.textContent="✓ Up to date";
  }catch(e){
    console.warn("refresh failed",e);
    btn.textContent="Refresh failed";
  }finally{
    setTimeout(()=>{ btn.disabled=false; btn.textContent=label; },1400);
  }
}

// ---- writing back to Grist ----
// Grist stores a Date as epoch seconds at UTC midnight; a DateTime as a real instant, so for
// those we send local midnight instead. Read back with the matching UTC/local parts.
function dateToGrist(d,type){ if(!d)return null;
  return /^DateTime/.test(type||"") ? Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/1000)
                                    : Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/1000; }
// Grist date value -> "YYYY-MM-DD" for an <input type="date">, and back again.
function dateToInput(v,type){ const d=toDate(v); if(!d)return "";
  const utc=!/^DateTime/.test(type||"") && typeof v==="number";
  const y=utc?d.getUTCFullYear():d.getFullYear(), m=(utc?d.getUTCMonth():d.getMonth())+1, dd=utc?d.getUTCDate():d.getDate();
  return y+"-"+String(m).padStart(2,"0")+"-"+String(dd).padStart(2,"0"); }
function inputToGrist(s,type){ if(!s)return null; const p=String(s).split("-").map(Number);
  if(p.length!==3||!p[0])return null; return dateToGrist(new Date(p[0],p[1]-1,p[2]),type); }
// One batched write for both single and bulk edits, then re-read so the view matches the doc.
async function writeRows(updates){
  if(!updates.length) return;
  if(!state.grist){                                     // standalone/demo: patch the sample rows
    updates.forEach(u=>{ const r=state.stone.find(x=>x.id===u.id); if(r) Object.assign(r,u.fields); });
    reindex(); render(); return;
  }
  await grist.docApi.applyUserActions(updates.map(u=>["UpdateRecord","Stone_Order",u.id,u.fields]));
  await refetch();
}

stoneSearch.oninput=e=>{ state.searchQ=e.target.value; render(); };
document.getElementById("searchClr").onclick=()=>{ state.searchQ=""; stoneSearch.value=""; render(); stoneSearch.focus(); };
document.getElementById("colsBtn").onclick=e=>{ e.stopPropagation(); toggleColEditor(); };
document.getElementById("groupBtn").onclick=e=>{ e.stopPropagation(); closePops();
  groupBySup=!groupBySup; savePrefs(); render(); };
document.getElementById("reloadBtn").onclick=e=>{ e.stopPropagation(); closePops(); hardRefresh(e.shiftKey); };
document.getElementById("newBtn").onclick=e=>{ e.stopPropagation(); closePops(); openNew(null); };
document.getElementById("bulkBtn").onclick=e=>{ e.stopPropagation(); closePops(); setBulk(!state.bulk); };
document.getElementById("bulkBar").onclick=e=>e.stopPropagation();
document.getElementById("bulkClear").onclick=()=>{ state.sel.clear(); render(); };
document.getElementById("bulkApply").onclick=()=>applyBulk();
document.getElementById("editClose").onclick=()=>tryCloseEdit();
document.getElementById("jobClose").onclick=()=>closeJobPanel();
document.getElementById("jobModal").onclick=e=>{ if(e.target.id==="jobModal") closeJobPanel(); };
document.getElementById("editModal").onclick=e=>{ if(e.target.id==="editModal") tryCloseEdit(); };
document.getElementById("cfBox").onclick=e=>{ if(e.target.id==="cfBox") closeConfirm(null); };
document.getElementById("dayPop").onclick=e=>e.stopPropagation();
document.addEventListener("click",closePops);
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  // innermost first: confirm dialog, then the edit panel (which asks about unsaved work), then popups
  if(document.getElementById("cfBox").classList.contains("open")){ closeConfirm(null); return; }
  if(document.getElementById("jobModal").classList.contains("open")){ closeJobPanel(); return; }
  if(document.getElementById("editModal").classList.contains("open")){ tryCloseEdit(); return; }
  if(state.bulk){ setBulk(false); return; }
  closePops();
});

// restore this person's columns, date-column width, font size and totals preference
loadTablePrefs();
applyTableVars();
loadPrefs();                                   // restore the saved agenda direction
if(!state.ref.product) state.ref.product=DEMO_REF.product;
if(!state.ref.client)  state.ref.client=DEMO_REF.client;
// sample-first so the grid is never blank; live wiring above flips + replaces it.
window._test(SAMPLE_STONE,SAMPLE_JOBS,SAMPLE_CAT,SAMPLE_CLIENTS);
</script>
</body>
</html>
